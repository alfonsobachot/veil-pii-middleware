<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>veil — live flow</title>
<style>
  :root {
    --bg: #0d1016;
    --panel: #151a23;
    --panel-2: #1b212c;
    --border: #283040;
    --text: #e7eaf0;
    --muted: #8b93a5;
    --regex: #4fb0ff;
    --llm: #ffa64f;
    --encoder: #f06fd0;
    --token: #46d68c;
    --detoken: #c08cff;
    --api: #e8b04a;
    --local: #46c1d6;
    --danger: #ff6464;
    --accent: #f7074d;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 "Segoe UI", -apple-system, system-ui, sans-serif;
  }
  #root { height: 100%; }
  .app { display: grid; grid-template-columns: 440px minmax(0, 1fr); height: 100%; }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 13px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: #3d4a62; }
  button.primary { background: #23436e; border-color: #2f5d97; }
  button.accent { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }
  button:disabled { opacity: 0.45; cursor: default; }
  .muted { color: var(--muted); }
  code, .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }

  /* ---- left sidebar ---- */
  .side { border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 14px 18px 10px; display: flex; align-items: baseline; gap: 10px; }
  .brand b { color: var(--token); font-size: 22px; }
  .brand span { color: var(--muted); font-size: 13px; }
  .ask { padding: 4px 18px 14px; border-bottom: 1px solid var(--border); }
  .ask textarea {
    width: 100%; min-height: 112px; resize: vertical; background: #0f131b; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font: 15px/1.45 inherit;
    font-family: inherit;
  }
  .ask textarea:focus { outline: none; border-color: #2f5d97; }
  .ask-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .ask-row .spacer { flex: 1; }
  .ask-status { margin-top: 8px; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .ask-status.err { color: var(--danger); }
  .ask-status.ok { color: var(--token); }
  .ask details { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .ask details pre { white-space: pre-wrap; max-height: 160px; overflow: auto; margin: 4px 0 0; }
  .link { background: none; border: none; color: #7fb4ff; padding: 0; font-size: 13px; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 10px; }
  .tabs button { background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted); padding: 10px 10px 8px; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .tab-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; }
  .turn { display: block; width: 100%; text-align: left; margin-bottom: 6px; padding: 8px 10px; }
  .turn.sel { border-color: #2f5d97; background: #1d2c44; }
  .turn .p { white-space: pre-wrap; word-break: break-word; }
  .turn .m { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .scope { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .scope .chip { border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; }
  .scope label { display: flex; gap: 5px; align-items: center; cursor: pointer; margin-left: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { padding: 4px 4px; text-align: left; border-bottom: 1px solid #1f2633; vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  .audit-new { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: #46d68c33; } to { background: transparent; } }
  .small { font-size: 12px; padding: 2px 8px; }
  .filter { width: 100%; margin-bottom: 8px; background: #0f131b; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px; font: inherit; }

  /* ---- main ---- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .top { padding: 12px 22px 10px; border-bottom: 1px solid var(--border); }
  .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; display: flex; gap: 8px; align-items: baseline; }
  .stat .v { font-size: 20px; font-weight: 600; }
  .stat .l { color: var(--muted); font-size: 12.5px; }
  .stat.good .v { color: var(--token); }
  .bar .spacer { flex: 1; }
  .follow { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13.5px; cursor: pointer; user-select: none; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; margin-top: 8px; justify-content: center; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  /* diagram: fixed 1000x280 drawing, scaled to the space available */
  .diagram-fit { display: flex; justify-content: center; }
  .diagram-frame { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .diagram { position: relative; width: 1000px; height: 280px; transform-origin: top left; }
  .diagram svg { position: absolute; inset: 0; }
  .edge { fill: none; stroke: #2c3546; stroke-width: 2.5; transition: stroke 0.4s; }
  .edge.hot { stroke: #6aa8ff; }
  .edge.local { stroke-dasharray: 5 5; }
  .zone { fill: none; stroke: #23303f; stroke-dasharray: 4 6; }
  .zone-label { fill: var(--muted); font-size: 11px; letter-spacing: 1px; }
  .node {
    position: absolute; width: 132px; margin-left: -66px; margin-top: -26px; height: 52px;
    border-radius: 10px; border: 1.5px solid var(--border); background: var(--panel-2);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
  }
  .node .n { font-weight: 600; font-size: 13px; }
  .node .s { font-size: 11px; color: var(--muted); }
  .node.api { border-color: #6b5626; }
  .node.lit { border-color: var(--c, #6aa8ff); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c, #6aa8ff) 30%, transparent), 0 0 22px color-mix(in srgb, var(--c, #6aa8ff) 45%, transparent); transform: scale(1.05); }
  .packet {
    position: absolute; left: 0; top: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px;
    border-radius: 50%; background: var(--c, #6aa8ff); box-shadow: 0 0 12px var(--c, #6aa8ff);
    offset-rotate: 0deg; animation: travel var(--d, 0.7s) ease-in-out var(--delay, 0s) both;
  }
  .packet .lbl {
    position: absolute; left: 16px; top: -6px; white-space: nowrap; font: 600 11px/1 ui-monospace, Consolas, monospace;
    color: var(--c); background: #0d1016cc; padding: 3px 5px; border-radius: 4px;
  }
  @keyframes travel { from { offset-distance: 0%; opacity: 1; } 92% { opacity: 1; } to { offset-distance: 100%; opacity: 0; } }

  /* ---- steps ---- */
  .steps { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 22px 40px; display: flex; flex-direction: column; gap: 12px; }
  .step {
    background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--c, var(--border));
    border-radius: 10px; padding: 10px 14px 12px; animation: rise 0.45s ease-out both;
  }
  .step.current { box-shadow: 0 0 0 1px var(--c), 0 6px 26px #0008; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .step-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .step-head .idx { color: var(--muted); font-variant-numeric: tabular-nums; }
  .step-head .t { font-weight: 600; font-size: 16px; }
  .step-head .where { font-size: 12px; color: var(--c); border: 1px solid var(--c); border-radius: 999px; padding: 0 8px; }
  .step-head .meta { color: var(--muted); font-size: 12.5px; margin-left: auto; }
  .step .why { color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
  .ba { display: grid; grid-template-columns: minmax(0, 1fr) 26px minmax(0, 1fr); gap: 6px; align-items: stretch; }
  .ba .arrow { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 18px; }
  .box { background: #0f131b; border: 1px solid var(--border); border-radius: 8px; min-width: 0; display: flex; flex-direction: column; }
  .box .bl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); padding: 5px 9px 0; }
  .box pre {
    margin: 0; padding: 6px 9px 9px; white-space: pre-wrap; word-break: break-word;
    font: 13.5px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; max-height: 34vh; overflow: auto;
  }
  .hl { border-radius: 3px; padding: 0 2px; }
  .hl.REGEX { background: #4fb0ff33; box-shadow: inset 0 -2px var(--regex); }
  .hl.LLM { background: #ffa64f33; box-shadow: inset 0 -2px var(--llm); }
  .hl.ENCODER { background: #f06fd033; box-shadow: inset 0 -2px var(--encoder); }
  .hl.tok { background: #46d68c26; color: #8ff0bb; box-shadow: inset 0 -2px var(--token); }
  .hl.real { background: #c08cff2b; color: #e2c9ff; box-shadow: inset 0 -2px var(--detoken); }
  .waiting { color: var(--muted); padding: 6px 4px; display: flex; gap: 8px; align-items: center; }
  .dot-pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--api); animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity: 0.25; } to { opacity: 1; } }
  .empty { color: var(--muted); padding: 40px 10px; text-align: center; }
  .views { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
  .views button { border: none; background: none; padding: 4px 14px; color: var(--muted); }
  .views button.on { background: var(--panel-2); color: var(--text); box-shadow: inset 0 -2px var(--accent); }

  /* ---- metrics ---- */
  .metrics { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 22px 48px; }
  .metrics h2 { font-size: 17px; margin: 26px 0 4px; }
  .metrics h2:first-child { margin-top: 4px; }
  .metrics .lede { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; max-width: 980px; }
  .kpis { display: flex; gap: 10px; flex-wrap: wrap; }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; min-width: 130px; }
  .kpi .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi .l { color: var(--muted); font-size: 12.5px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 4px 6px; overflow-x: auto; }
  table.bench { font-size: 13.5px; min-width: 900px; }
  table.bench th { position: sticky; top: 0; background: var(--panel); white-space: nowrap; padding: 8px 8px 6px; cursor: pointer; user-select: none; }
  table.bench th.num, table.bench td.num { text-align: right; }
  table.bench td { padding: 7px 8px; border-bottom: 1px solid #1f2633; vertical-align: middle; }
  table.bench tr:last-child td { border-bottom: none; }
  table.bench tr.demo td { background: #46d68c0d; }
  .det-name { font-weight: 600; }
  .det-sub { color: var(--muted); font-size: 12px; }
  .fam { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 7px; vertical-align: 0; }
  .num .n { font-variant-numeric: tabular-nums; }
  .num .n.best { color: var(--token); font-weight: 700; }
  .meter { height: 4px; border-radius: 2px; background: #232b39; margin-top: 4px; overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 2px; }
  .tag { font-size: 11px; border: 1px solid var(--token); color: var(--token); border-radius: 999px; padding: 0 6px; margin-left: 6px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .heat td.cell { text-align: center; font-variant-numeric: tabular-nums; border-radius: 4px; }
  .heat td.cell .pct { display: block; font-size: 11px; opacity: 0.8; }
  .structured { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .structured div { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  .structured b { display: block; font-size: 13px; }
  .structured span { color: var(--muted); font-size: 12px; }
  dl.defs { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13.5px; max-width: 980px; }
  dl.defs dt { font-weight: 600; }
  dl.defs dd { margin: 0; color: var(--muted); }
  .leak-0 { color: var(--token); font-weight: 600; }
  .leak-n { color: var(--danger); font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/veil-panel/vendor/react.production.min.js"></script>
<script src="/veil-panel/vendor/react-dom.production.min.js"></script>
<script src="/veil-panel/vendor/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo, useLayoutEffect } = React;

// Same constants as the gateway's PipelineEventBus.
const HISTORY_LIMIT = 20;
const HIDDEN_KINDS = new Set(["title_generation", "safety_check", "internal_continuation"]);
const TOKEN_RE = /PII_([A-Z]+)_\d{4}/g;
const REPLAY_STEP_MS = 2600;
// Audit rows replayed on load, and kept in memory.
const AUDIT_BACKLOG = 3000;
const AUDIT_KEEP = 6000;
const DEMO_PROMPT = "The user lucia.ferrer@riberanorte.es has an invoice problem. Can you check the database and tell me what happened?";
// Steps older than this page load are history: listed, never animated.
const PAGE_LOADED_AT = new Date(Date.now() - 1500).toISOString();

// ------------------------------------------------------------------ diagram
// Drawn in a fixed 1000x280 space (packets travel the same SVG paths through
// CSS offset-path) and scaled as a whole to the space available.
const NODES = {
  you:   { x: 70,  y: 70,  n: "You", s: "Claude Code", c: "#9fb3d1" },
  tok:   { x: 270, y: 70,  n: "veil gateway", s: "tokenize", c: "var(--token)" },
  api:   { x: 500, y: 70,  n: "Claude API", s: "only sees tokens", c: "var(--api)" },
  detok: { x: 730, y: 70,  n: "veil gateway", s: "detokenize", c: "var(--detoken)" },
  screen:{ x: 930, y: 70,  n: "Your screen", s: "real values", c: "#9fb3d1" },
  pre:   { x: 690, y: 215, n: "PreToolUse", s: "token → value", c: "var(--detoken)" },
  db:    { x: 500, y: 215, n: "Local database", s: "real data", c: "var(--local)" },
  post:  { x: 310, y: 215, n: "PostToolUse", s: "value → token", c: "var(--token)" },
};
const EDGES = {
  "you-tok": "M 136 70 L 204 70",
  "tok-api": "M 336 70 L 434 70",
  "api-detok": "M 566 70 L 664 70",
  "detok-screen": "M 796 70 L 864 70",
  "api-pre": "M 540 96 C 580 150, 640 170, 690 189",
  "pre-db": "M 624 215 L 566 215",
  "db-post": "M 434 215 L 376 215",
  "post-tok": "M 310 189 C 300 150, 285 120, 276 96",
};
const LOCAL_EDGES = new Set(["api-pre", "pre-db", "db-post", "post-tok"]);
const STEP_PATHS = {
  prompt: [["you-tok", "raw", "#9fb3d1"], ["tok-api", "tokens", "var(--token)"]],
  claude: [["api-detok", "tokens", "var(--api)"], ["detok-screen", "text", "var(--detoken)"]],
  pre:    [["api-pre", "PII_…", "var(--api)"], ["pre-db", "real value", "var(--detoken)"]],
  post:   [["db-post", "rows", "var(--local)"], ["post-tok", "tokens", "var(--token)"], ["tok-api", "tokens", "var(--token)"]],
  answer: [["api-detok", "tokens", "var(--api)"], ["detok-screen", "real values", "var(--detoken)"]],
};
const STEP_NODES = {
  prompt: ["you", "tok", "api"],
  claude: ["api", "detok", "screen"],
  pre: ["api", "pre", "db"],
  post: ["db", "post", "tok", "api"],
  answer: ["api", "detok", "screen"],
};
const PACKET_MS = 700;

function Diagram({ flow }) {
  const fitRef = useRef(null);
  const [scale, setScale] = useState(1);
  useLayoutEffect(() => {
    const el = fitRef.current;
    if (!el) return;
    const measure = () => {
      const maxH = Math.min(Math.max(window.innerHeight * 0.34, 220), 520);
      setScale(Math.max(0.5, Math.min((el.clientWidth - 2) / 1000, maxH / 280)));
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    window.addEventListener("resize", measure);
    return () => { ro.disconnect(); window.removeEventListener("resize", measure); };
  }, []);
  const kind = flow && flow.kind;
  const path = kind ? STEP_PATHS[kind] : [];
  const litNodes = kind ? STEP_NODES[kind] : [];
  const hotEdges = new Set(path.map((p) => p[0]));
  return (
    <div className="diagram-fit" ref={fitRef}>
      <div className="diagram-frame" style={{ width: 1000 * scale + 2, height: 280 * scale + 2 }}>
        <div className="diagram" style={{ transform: `scale(${scale})` }}>
          <svg width="1000" height="280" viewBox="0 0 1000 280">
            <rect className="zone" x="200" y="150" width="590" height="115" rx="14" />
            <text className="zone-label" x="212" y="272">YOUR MACHINE · REAL VALUES ONLY HERE</text>
            <text className="zone-label" x="455" y="22">INTERNET</text>
            {Object.entries(EDGES).map(([id, d]) => (
              <path key={id} d={d}
                className={"edge" + (LOCAL_EDGES.has(id) ? " local" : "") + (hotEdges.has(id) ? " hot" : "")}
                markerEnd="url(#arrow)" />
            ))}
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5873" />
              </marker>
            </defs>
          </svg>
          {Object.entries(NODES).map(([id, node]) => {
            const order = litNodes.indexOf(id);
            return (
              <div key={id + (order >= 0 ? flow.key : "")}
                className={"node" + (id === "api" ? " api" : "") + (order >= 0 ? " lit" : "")}
                style={{ left: node.x, top: node.y, "--c": node.c, transitionDelay: order >= 0 ? `${order * PACKET_MS}ms` : "0ms" }}>
                <div className="n">{node.n}</div>
                <div className="s">{node.s}</div>
              </div>
            );
          })}
          {path.map(([edge, label, colour], i) => (
            <div key={`${flow.key}-${i}`} className="packet"
              style={{ offsetPath: `path('${EDGES[edge]}')`, "--c": colour, "--delay": `${i * PACKET_MS}ms`, "--d": `${PACKET_MS}ms` }}>
              <span className="lbl">{label}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ------------------------------------------------------------------ text rendering
function renderTokens(text) {
  const parts = [];
  let last = 0;
  let m;
  TOKEN_RE.lastIndex = 0;
  while ((m = TOKEN_RE.exec(text)) !== null) {
    if (m.index > last) parts.push(text.slice(last, m.index));
    parts.push(<span className="hl tok" title={`token for a ${m[1]}`} key={m.index}>{m[0]}</span>);
    last = m.index + m[0].length;
  }
  parts.push(text.slice(last));
  return parts;
}

function renderSpans(text, spans) {
  if (!spans || !spans.length) return text;
  const sorted = [...spans].sort((a, b) => a.start - b.start);
  const parts = [];
  let last = 0;
  sorted.forEach((s, i) => {
    if (s.start < last) return;
    if (s.start > last) parts.push(text.slice(last, s.start));
    parts.push(
      <span className={`hl ${s.detector}`} title={`${s.entity_type} · ${s.detector}`} key={i}>{text.slice(s.start, s.end)}</span>
    );
    last = s.end;
  });
  parts.push(text.slice(last));
  return parts;
}

// Marks the real values in `resolved` by aligning it against `tokenized`:
// everything around a token is identical in both texts, so the literal runs
// anchor where each substituted value starts and ends. Where the two stop
// lining up (the hooks truncate both texts), the rest is shown plain.
function renderResolved(resolved, tokenized) {
  if (!tokenized) return resolved;
  const segs = [];
  let last = 0;
  let m;
  TOKEN_RE.lastIndex = 0;
  while ((m = TOKEN_RE.exec(tokenized)) !== null) {
    segs.push({ lit: tokenized.slice(last, m.index) });
    segs.push({ tok: m[0], type: m[1] });
    last = m.index + m[0].length;
  }
  segs.push({ lit: tokenized.slice(last) });
  if (!segs.some((s) => s.tok)) return resolved;
  const parts = [];
  let pos = 0;
  for (let i = 0; i < segs.length; i++) {
    const seg = segs[i];
    if (seg.lit !== undefined) {
      if (!seg.lit) continue;
      if (!resolved.startsWith(seg.lit, pos)) break;
      parts.push(seg.lit);
      pos += seg.lit.length;
      continue;
    }
    let anchor = "";
    for (let j = i + 1; j < segs.length; j++) {
      if (segs[j].lit) { anchor = segs[j].lit; break; }
    }
    const end = anchor ? resolved.indexOf(anchor, pos) : resolved.length;
    if (end === -1) break;
    parts.push(<span className="hl real" title={`real ${seg.type} (was ${seg.tok})`} key={i}>{resolved.slice(pos, end)}</span>);
    pos = end;
  }
  if (pos < resolved.length) parts.push(resolved.slice(pos));
  return parts;
}

function countTokens(text) {
  return new Set((text || "").match(TOKEN_RE) || []).size;
}

// ------------------------------------------------------------------ data
function useEventSource(path, onEvent) {
  const ref = useRef(onEvent);
  ref.current = onEvent;
  useEffect(() => {
    const source = new EventSource(path);
    source.onmessage = (ev) => {
      try { ref.current(JSON.parse(ev.data)); } catch (err) { /* skip a malformed line */ }
    };
    return () => source.close();
  }, [path]);
}

function roundIdsOf(cycles, turnId) {
  const children = Object.values(cycles)
    .filter((c) => c.requestId !== turnId && c.parentRequestId === turnId)
    .sort((a, b) => (a.firstSeenAt < b.firstSeenAt ? -1 : 1))
    .map((c) => c.requestId);
  return [turnId, ...children];
}

// One logical turn → the ordered list of step cards.
function buildSteps(cycles, turnId) {
  const turn = cycles[turnId];
  if (!turn) return { steps: [], inFlight: false };
  const ids = roundIdsOf(cycles, turnId);
  const steps = [];
  const received = turn.stages.received;
  const tokenized = turn.stages.tokenized;
  if (received) {
    steps.push({
      kind: "prompt", key: `${turnId}:prompt`, at: received.timestamp,
      before: received.text, beforeSpans: received.spans, after: tokenized ? tokenized.text : null,
    });
  }
  ids.forEach((id, round) => {
    const c = cycles[id];
    (c.hookEvents || []).forEach((h, i) => {
      steps.push({ kind: h.hook === "pre_tool_use" ? "pre" : "post", key: `${id}:h${i}`, at: h.timestamp, hook: h });
    });
    const resp = c.stages.response_received;
    const shown = c.stages.detokenized;
    if (resp && (resp.text || "").trim()) {
      steps.push({
        kind: "claude", key: `${id}:resp`, at: resp.timestamp,
        before: resp.text, after: shown ? shown.text : null, round,
      });
    }
  });
  steps.sort((a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : 0));
  const lastCycle = cycles[ids[ids.length - 1]];
  const inFlight = !(lastCycle && lastCycle.stages.displayed);
  // The final round's reply, once the turn is done, is "the answer".
  const lastReply = [...steps].reverse().find((s) => s.kind === "claude");
  if (!inFlight && lastReply && lastReply.round === ids.length - 1) lastReply.kind = "answer";
  return { steps, inFlight };
}

function turnStats(cycles, turnId, steps) {
  const ids = roundIdsOf(cycles, turnId);
  const tokens = new Set();
  ids.forEach((id) => {
    const c = cycles[id];
    ["tokenized", "response_received"].forEach((st) => {
      ((c.stages[st] && c.stages[st].text) || "").replace(TOKEN_RE, (t) => tokens.add(t));
    });
    (c.hookEvents || []).forEach((h) => (h.after || "").replace(TOKEN_RE, (t) => tokens.add(t)));
  });
  return { tokens: tokens.size, rounds: ids.length, tools: steps.filter((s) => s.kind === "pre").length };
}

// What belongs to one prompt: its Claude Code session, the time it ran (from
// its first event to its last; open-ended while in flight) and every token
// seen in its texts. The vault and audit tabs filter on this.
const SCOPE_BEFORE_MS = 2000;
const SCOPE_AFTER_MS = 5000;
function turnScope(cycles, turnId, inFlight) {
  const ids = roundIdsOf(cycles, turnId);
  const tokens = new Set();
  let sessionId = null;
  let start = Infinity, end = -Infinity;
  const seeTime = (t) => {
    if (!t) return;
    const ms = Date.parse(t);
    if (ms < start) start = ms;
    if (ms > end) end = ms;
  };
  const seeText = (t) => (t || "").replace(TOKEN_RE, (tok) => tokens.add(tok));
  ids.forEach((id) => {
    const c = cycles[id];
    if (!c) return;
    sessionId = sessionId || c.sessionId;
    Object.values(c.stages).forEach((st) => { seeTime(st.timestamp); seeText(st.text); });
    (c.hookEvents || []).forEach((h) => { seeTime(h.timestamp); seeText(h.before); seeText(h.after); });
  });
  return {
    sessionId, tokens,
    from: start - SCOPE_BEFORE_MS,
    to: inFlight ? Infinity : end + SCOPE_AFTER_MS,
  };
}

function Box({ label, children, preRef, onScroll }) {
  return (
    <div className="box">
      <div className="bl">{label}</div>
      <pre ref={preRef} onScroll={onScroll}>{children}</pre>
    </div>
  );
}

// Scrolling either box of a before/after pair scrolls the other to the same
// relative position, so the two texts stay side by side. The box being
// scrolled by the user leads; the follower's own scroll events are ignored
// until the leader goes quiet.
function useSyncedScroll() {
  const left = useRef(null);
  const right = useRef(null);
  const leader = useRef(null);
  const timer = useRef(null);
  const follow = (src, dst) => () => {
    if (leader.current && leader.current !== src) return;
    leader.current = src;
    clearTimeout(timer.current);
    timer.current = setTimeout(() => { leader.current = null; }, 120);
    const a = src.current, b = dst.current;
    if (!a || !b) return;
    const max = a.scrollHeight - a.clientHeight;
    const ratio = max > 0 ? a.scrollTop / max : 0;
    b.scrollTop = ratio * (b.scrollHeight - b.clientHeight);
  };
  useEffect(() => () => clearTimeout(timer.current), []);
  return { left, right, onLeft: follow(left, right), onRight: follow(right, left) };
}

function StepCard({ step, index, current }) {
  const meta = STEP_META[step.kind];
  const sync = useSyncedScroll();
  let before = null, after = null, metaText = "", error = false;
  if (step.kind === "prompt") {
    before = renderSpans(step.before, step.beforeSpans);
    after = step.after == null ? <span className="muted">…</span> : renderTokens(step.after);
    metaText = `${(step.beforeSpans || []).length} value(s) detected`;
  } else if (step.kind === "pre" || step.kind === "post") {
    const h = step.hook;
    error = h.phase === "error";
    const b = h.before || "", a = h.after;
    if (step.kind === "pre") {
      before = renderTokens(b);
      after = a == null ? <span className="muted">(blocked)</span> : renderResolved(a, b);
      metaText = `${countTokens(b)} token(s) resolved`;
    } else {
      before = a == null ? b : renderResolved(b, a);
      after = a == null ? <span className="muted">(tokenization failed — the gateway still scans it)</span> : renderTokens(a);
      metaText = a == null ? "" : `${countTokens(a)} distinct token(s)`;
    }
  } else {
    before = renderTokens(step.before);
    after = step.after == null ? <span className="muted">…</span> : renderResolved(step.after, step.before);
    metaText = `${countTokens(step.before)} token(s) resolved`;
  }
  return (
    <div className={"step" + (current ? " current" : "")} style={{ "--c": error ? "var(--danger)" : meta.c }} data-step={index}>
      <div className="step-head">
        <span className="idx">{index + 1}</span>
        <span className="t">{meta.title}{error ? " — failed" : ""}</span>
        <span className="where">{meta.where}</span>
        <span className="meta">{metaText} · {new Date(step.at).toLocaleTimeString()}</span>
      </div>
      <div className="why">{meta.why}</div>
      <div className="ba">
        <Box label={meta.bl[0]} preRef={sync.left} onScroll={sync.onLeft}>{before}</Box>
        <div className="arrow">→</div>
        <Box label={meta.bl[1]} preRef={sync.right} onScroll={sync.onRight}>{after}</Box>
      </div>
    </div>
  );
}

// ------------------------------------------------------------------ sidebar
function AskBox({ onStarted, onRunning }) {
  const [text, setText] = useState("");
  const [state, setState] = useState({ running: false, enabled: true });
  const [error, setError] = useState("");
  const poll = useCallback(() => {
    fetch("/veil-panel/ask").then((r) => r.json()).then(setState).catch(() => {});
  }, []);
  useEffect(() => { poll(); }, [poll]);
  useEffect(() => { onRunning(!!state.running); }, [state.running]);
  useEffect(() => {
    if (!state.running) return;
    const id = setInterval(poll, 1000);
    return () => clearInterval(id);
  }, [state.running, poll]);

  const run = () => {
    const prompt = text.trim();
    if (!prompt || state.running) return;
    setError("");
    fetch("/veil-panel/ask", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt }),
    })
      .then((r) => r.json().then((d) => ({ ok: r.ok, d })))
      .then(({ ok, d }) => {
        if (!ok) { setError(d.error || "could not start"); return; }
        setState(d);
        onStarted();
      })
      .catch(() => setError("gateway unreachable"));
  };

  let status = null;
  if (!state.enabled) status = <div className="ask-status err">Disabled: start the gateway with scripts/run-gateway.sh</div>;
  else if (error) status = <div className="ask-status err">{error}</div>;
  else if (state.running) status = <div className="ask-status"><span className="dot-pulse" /> Running… {Math.round(state.elapsed || 0)} s</div>;
  else if (state.exit_code === 0) status = <div className="ask-status ok">Done in {Math.round(state.seconds)} s</div>;
  else if (state.exit_code !== undefined) status = <div className="ask-status err">Failed ({state.exit_code === null ? "no exit code" : `exit ${state.exit_code}`})</div>;

  return (
    <div className="ask">
      <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="Ask about the demo database…"
        onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); run(); } }}
        disabled={state.running} />
      <div className="ask-row">
        <button className="link" onClick={() => setText(DEMO_PROMPT)} disabled={state.running}>use the demo prompt</button>
        <span className="spacer" />
        <button className="accent" onClick={run} disabled={state.running || !text.trim() || !state.enabled}>Run ▶</button>
      </div>
      {status}
      {!state.running && state.output && state.exit_code !== 0 && (
        <details><summary>output</summary><pre>{state.output}</pre></details>
      )}
    </div>
  );
}

function auditKey(e) {
  return `${e.timestamp}|${e.token}|${e.offset}|${e.adapter}`;
}

function inScope(scope, ms) {
  return ms >= scope.from && ms <= scope.to;
}

function AuditPane({ hidden, rows, scope }) {
  const shown = scope ? rows.filter((r) => inScope(scope, Date.parse(r.timestamp))) : [];
  const byDetector = {};
  shown.forEach((r) => { byDetector[r.detector] = (byDetector[r.detector] || 0) + 1; });
  return (
    <div hidden={hidden}>
      <div className="scope">
        <span>Every substitution made for the selected prompt. Never a value.</span>
        {Object.entries(byDetector).map(([d, n]) => <span key={d} className="chip">{d.toLowerCase()} {n}</span>)}
      </div>
      <table>
        <thead><tr><th>Time</th><th>Where</th><th>Detector</th><th>Token</th></tr></thead>
        <tbody>
          {[...shown].reverse().map((r) => (
            <tr key={r._k} className={r._live ? "audit-new" : ""}>

}

function VaultPane({ hidden, scope, onCount }) {
  const [mappings, setMappings] = useState([]);
  const [revealed, setRevealed] = useState({});
  const [filter, setFilter] = useState("");
  const [everything, setEverything] = useState(false);
  const refresh = useCallback(() => {
    fetch("/veil-panel/vault").then((r) => r.json()).then((d) => setMappings(d.mappings || [])).catch(() => {});
  }, []);
  useEffect(() => { refresh(); const id = setInterval(refresh, 4000); return () => clearInterval(id); }, [refresh]);
  const key = (m) => `${m.session_id} ${m.token}`;
  const reveal = (m) => {
    fetch("/veil-panel/vault/reveal", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: m.token, session_id: m.session_id }),
    })
      .then((r) => r.json())
      .then((d) => setRevealed((p) => ({ ...p, [key(m)]: d.value ?? d.error ?? "(error)" })))
      .catch(() => setRevealed((p) => ({ ...p, [key(m)]: "(gateway unreachable)" })));
  };
  // A prompt's tokens: same session, and either seen in its texts or minted
  // while it ran (the hooks' texts are truncated, so a token can be missing
  // from them).
  const scoped = !scope ? [] : mappings.filter((m) =>
    (!scope.sessionId || m.session_id === scope.sessionId) &&
    (scope.tokens.has(m.token) || inScope(scope, m.created_at * 1000)));
  const base = everything ? mappings : scoped;
  useEffect(() => { onCount(scoped.length); });
  const shown = base
    .filter((m) => !filter || m.token.includes(filter.toUpperCase()))
    .sort((a, b) => (a.token < b.token ? -1 : 1));
  return (
    <div hidden={hidden}>
      <input className="filter" placeholder="filter, e.g. IBAN" value={filter} onChange={(e) => setFilter(e.target.value)} />
      <div className="scope">
        <span>AES-GCM · {everything ? `${mappings.length} tokens, every session` : `${scoped.length} tokens for the selected prompt`}</span>
        <label><input type="checkbox" checked={everything} onChange={(e) => setEverything(e.target.checked)} /> all sessions</label>
      </div>
      <table>
        <thead><tr><th>Token</th><th>Stored as</th><th></th></tr></thead>
        <tbody>
          {shown.slice(0, 300).map((m) => {
            const k = key(m);
            return (
              <tr key={k}>
                <td className="mono">{m.token}</td>
                <td className="mono muted" title={m.ciphertext_b64}>
                  {revealed[k] !== undefined ? <span style={{ color: "var(--detoken)" }}>{revealed[k]}</span> : m.ciphertext_b64.slice(0, 14) + "…"}
                </td>
                <td>
                  {revealed[k] !== undefined
                    ? <button className="small" onClick={() => setRevealed((p) => { const n = { ...p }; delete n[k]; return n; })}>Hide</button>
                    : <button className="small" onClick={() => reveal(m)}>Reveal</button>}
                </td>
              </tr>
            );
          })}
          {!shown.length && <tr><td colSpan="3" className="muted">{scope || everything ? "No tokens." : "Select a prompt."}</td></tr>}
        </tbody>
      </table>
    </div>
  );
}

const FAMILY = {

  encoder: { c: "var(--encoder)", label: "encoder" },
  combo: { c: "var(--token)", label: "LLM + GLiNER" },

// Columns of the soft-layer table: key, header, how to read it, higher is better?
const SOFT_COLS = [
  ["recall", "Recall", "share of the real PII found (every miss is a leak)", true],
  ["precision", "Precision", "share of detections that were real PII", true],
  ["f1", "F1", "harmonic mean of recall and precision", true],
  ["f2", "F2", "like F1, recall weighted twice", true],
  ["soft_fp", "Soft FP", "soft spans that matched no real value (over-tokenization)", false],
  ["decoys", "Decoys", "look-alike values wrongly tagged (of 194)", false],
  ["ms_per_cell", "ms / cell", "average detection time per database cell", false],
];
const RATIO_COLS = new Set(["recall", "precision", "f1", "f2"]);
const fmtRatio = (v) => v.toFixed(3);
const fmtInt = (v) => (v == null ? "–" : v.toLocaleString("en-US"));
const fmtMs = (v) => (v >= 100 ? v.toFixed(0) : v.toFixed(1));

function heat(ratio) {
  if (ratio >= 0.97) return "#46d68c38";
  if (ratio >= 0.9) return "#9fd64626";
  if (ratio >= 0.75) return "#e8b04a2e";
  if (ratio >= 0.5) return "#ff8a4f2e";
  return "#ff646433";
}

function Meter({ value, max, colour, log }) {
  let w = 0;
  if (log) w = Math.max(0.04, Math.log10(1 + value) / Math.log10(1 + max));
  else w = max ? value / max : 0;
  return <div className="meter"><i style={{ width: `${Math.min(1, w) * 100}%`, background: colour }} /></div>;
}

function SoftTable({ rows }) {
  const [sort, setSort] = useState(["f2", true]);
  const [key, desc] = sort;
  const sorted = [...rows].sort((a, b) => ((a[key] ?? 0) - (b[key] ?? 0)) * (desc ? -1 : 1));
  const best = {};
  const max = {};
  SOFT_COLS.forEach(([k, , , higher]) => {
    const vals = rows.map((r) => r[k]).filter((v) => v != null);
    best[k] = higher ? Math.max(...vals) : Math.min(...vals);
    max[k] = Math.max(...vals, 0);
  });
  return (
    <div className="card">
      <table className="bench">
        <thead>
          <tr>
            <th onClick={() => setSort(["f2", true])}>Detector (regex always on)</th>
            {SOFT_COLS.map(([k, label, help, higher]) => (
              <th key={k} className="num" title={help}
                onClick={() => setSort([k, key === k ? !desc : higher])}>
                {label}{key === k ? (desc ? " ↓" : " ↑") : ""}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {sorted.map((r) => {
            const fam = FAMILY[r.family] || FAMILY.encoder;
            return (
              <tr key={r.id} className={r.demo ? "demo" : ""}>
                <td>
                  <div className="det-name"><i className="fam" style={{ background: fam.c }} />{r.detector}{r.demo && <span className="tag">current demo</span>}</div>
                  <div className="det-sub">{r.layers} · {r.size}</div>
                  {r.note && <div className="note">{r.note}</div>}
                </td>
                {SOFT_COLS.map(([k]) => {
                  const v = r[k];
                  const text = v == null ? "–" : RATIO_COLS.has(k) ? fmtRatio(v) : k === "ms_per_cell" ? fmtMs(v) : fmtInt(v);
                  const colour = RATIO_COLS.has(k) ? fam.c : k === "ms_per_cell" ? "#6aa8ff" : "var(--danger)";
                  return (
                    <td key={k} className="num">
                      <span className={"n" + (v === best[k] ? " best" : "")}>{text}</span>
                      {v != null && <Meter value={v} max={RATIO_COLS.has(k) ? 1 : max[k]} log={k === "ms_per_cell"} colour={colour} />}
                    </td>
                  );
                })}
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function median(xs) {
  const s = [...xs].sort((a, b) => a - b);
  if (!s.length) return null;
  return s.length % 2 ? s[(s.length - 1) / 2] : (s[s.length / 2 - 1] + s[s.length / 2]) / 2;
}

}

function MetricsView() {
  const [data, setData] = useState(null);
  const [error, setError] = useState("");
  useEffect(() => {
    fetch("/veil-panel/benchmarks").then((r) => r.json()).then(setData).catch(() => setError("could not load the benchmark results"));
  }, []);
  if (error) return <div className="metrics"><div className="empty">{error}</div></div>;
  if (!data) return <div className="metrics"><div className="empty">Loading…</div></div>;
  const st = data.structured;
  const stFound = st.types.reduce((a, t) => a + t.found, 0);
  const stTotal = st.types.reduce((a, t) => a + t.support, 0);
  return (
    <div className="metrics">
      <h2>Benchmark corpus</h2>
      <p className="lede">Synthetic database from {data.corpus.source}: English free text with Spanish data. Every run is regex plus the soft detector(s) named, the way the gateway runs. Measured {data.measured} at commit {data.commit}; {data.hardware}.</p>
      <div className="kpis">
        <div className="kpi"><div className="v">{fmtInt(data.corpus.cells)}</div><div className="l">database cells scanned</div></div>
        <div className="kpi"><div className="v">{fmtInt(data.corpus.instances)}</div><div className="l">real PII values</div></div>
        <div className="kpi"><div className="v">{fmtInt(data.corpus.soft_instances)}</div><div className="l">soft values (names, orgs…)</div></div>
        <div className="kpi"><div className="v">{fmtInt(data.corpus.decoys)}</div><div className="l">decoys (look-alikes)</div></div>
        <div className="kpi"><div className="v">{((stFound / stTotal) * 100).toFixed(0)}%</div><div className="l">structured recall (regex)</div></div>
      </div>

      {data.demo_runs && data.demo_runs.length > 0 && <>
        <h2>The demo turn, end to end</h2>
        <p className="lede">The presentation prompt run through the real gateway, hooks and Claude API, with a recording proxy between the gateway and the API. A leak is any of the 22 synthetic values of the demo customer found in clear in a forwarded request.</p>
        <DemoRuns configs={data.demo_runs} />
      </>}

      <h2>Soft layer: detector comparison</h2>
      <p className="lede">Names, companies, addresses, birth dates, usernames and health data: what no regex can prove. Click a column to sort; the best value in each column is green. Bars for ms / cell use a log scale.</p>
      <SoftTable rows={data.soft} />

      <h2>Soft layer by entity type (found / total)</h2>
      <p className="lede">Green is 97% or more; red is under half.</p>
      <TypeHeat rows={data.soft} types={data.soft_types} />

      <h2>Structured layer: regex with check digits</h2>
      <p className="lede">{fmtInt(stFound)} of {fmtInt(stTotal)} found, {st.decoys} decoys hit, {st.ms_per_cell} ms per cell. DNI/NIE letter, IBAN mod-97, card Luhn and the other format rules make these exact.</p>
      <div className="structured">
        {st.types.map((t) => <div key={t.type}><b>{t.type}</b><span>{t.found}/{t.support} · {t.fp} FP</span></div>)}
      </div>

      <h2>How to read it</h2>
      <dl className="defs">
        <dt>Recall</dt><dd>Share of the real PII that was detected. The safety metric: every miss is a value that reaches the API in clear.</dd>
        <dt>Precision</dt><dd>Share of the detections that were real PII. A false positive leaks nothing; it only over-tokenizes.</dd>
        <dt>F1 / F2</dt><dd>Harmonic means of the two; F2 weights recall twice, which fits a privacy tool.</dd>
        <dt>Soft FP</dt><dd>Soft-layer spans that matched no real value.</dd>
        <dt>Decoys</dt><dd>Values that look like PII but are not (DNI with a wrong letter, Luhn-failing card, invalid IP…). Any span on one counts.</dd>
        <dt>ms / cell</dt><dd>Average detection time for one database cell, GPU, one call at a time.</dd>
        <dt>Matching</dt><dd>Structured types need the exact span and type. Soft values count as found when the soft spans cover at least 90% of their characters, whatever the label.</dd>
      </dl>
    </div>
  );
}

// ------------------------------------------------------------------ app
function App() {
  const [cycles, setCycles] = useState({});
  const [order, setOrder] = useState([]);
  const [selected, setSelected] = useState(null);
  const [follow, setFollow] = useState(true);
  const [flow, setFlow] = useState(null);
  const [replay, setReplay] = useState(null); // steps shown while replaying
  const [tab, setTab] = useState("prompts");
  const [view, setView] = useState("flow");
  const [askRunning, setAskRunning] = useState(false);
  const [auditRows, setAuditRows] = useState([]);
  const [vaultCount, setVaultCount] = useState(0);
  const auditSeen = useRef(new Set());
  const followRef = useRef(follow);
  followRef.current = follow;
  const known = useRef(new Set());
  const animated = useRef({});
  const stepsRef = useRef(null);

  // The backlog replays earlier prompts' rows; a reconnect replays it again,
  // so rows are de-duplicated by their own fields.
  useEventSource(`/veil-panel/audit-stream?backlog=${AUDIT_BACKLOG}`, (e) => {
    const k = auditKey(e);
    if (auditSeen.current.has(k)) return;
    auditSeen.current.add(k);
    const live = e.timestamp >= PAGE_LOADED_AT;
    setAuditRows((prev) => [...prev, { ...e, _k: k, _live: live }].slice(-AUDIT_KEEP));
  });

  useEventSource("/veil-panel/pipeline-stream", (ev) => {
    const { request_id, stage, text, spans, timestamp, kind, parent_request_id, session_id } = ev;
    const isNew = !known.current.has(request_id);
    known.current.add(request_id);
    setCycles((prev) => {
      const ex = prev[request_id];
      const stages = stage ? { ...(ex ? ex.stages : {}), [stage]: { text, spans, timestamp } } : ex ? ex.stages : {};
      const hookEvents = kind === "hook" ? [...(ex ? ex.hookEvents : []), ev] : ex ? ex.hookEvents : [];
      return {
        ...prev,
        [request_id]: {
          requestId: request_id, stages, hookEvents,
          kind: kind && kind !== "hook" ? kind : ex ? ex.kind : "conversation",
          parentRequestId: parent_request_id || (ex ? ex.parentRequestId : null) || null,
          sessionId: session_id || (ex ? ex.sessionId : null) || null,
          firstSeenAt: ex ? ex.firstSeenAt : timestamp,
        },
      };
    });
    if (kind === "hook" || HIDDEN_KINDS.has(kind || "conversation")) return;
    if (isNew && !parent_request_id) {
      setOrder((prev) => (prev.includes(request_id) ? prev : [...prev, request_id].slice(-HISTORY_LIMIT)));
      if (followRef.current) setSelected(request_id);
    }
  });

  const turns = order.filter((id) => cycles[id] && !(cycles[id].parentRequestId && cycles[cycles[id].parentRequestId]));
  const latest = turns[turns.length - 1];
  const { steps, inFlight } = useMemo(() => (selected ? buildSteps(cycles, selected) : { steps: [], inFlight: false }), [cycles, selected]);
  const stats = selected ? turnStats(cycles, selected, steps) : null;
  const scope = useMemo(() => (selected ? turnScope(cycles, selected, inFlight) : null), [cycles, selected, inFlight]);
  const auditCount = scope ? auditRows.filter((r) => inScope(scope, Date.parse(r.timestamp))).length : 0;
  const visible = replay == null ? steps : steps.slice(0, replay);

  const scrollTo = (index, block) => {
    const box = stepsRef.current;
    const el = box && box.querySelector(`[data-step="${index}"]`);
    if (el) el.scrollIntoView({ behavior: "smooth", block });
  };

  // Live: animate each new step of the selected turn; scroll only when following.
  useEffect(() => {
    if (replay != null || !selected) return;
    const seen = animated.current[selected] || 0;
    if (steps.length <= seen) return;
    animated.current[selected] = steps.length;
    const s = steps[steps.length - 1];
    if (!s.at || s.at < PAGE_LOADED_AT) return;
    setFlow({ kind: s.kind, key: `${s.key}-${Date.now()}` });
    if (followRef.current) setTimeout(() => scrollTo(steps.length - 1, "end"), 60);
  }, [steps, selected, replay]);

  // Replay: reveal the selected turn's steps one at a time.
  useEffect(() => {
    if (replay == null) return;
    if (replay > 0 && replay <= steps.length) {
      const s = steps[replay - 1];
      setFlow({ kind: s.kind, key: `${s.key}-replay-${replay}` });
      setTimeout(() => scrollTo(replay - 1, "center"), 60);
    }
    const done = replay >= steps.length;
    const t = setTimeout(() => setReplay(done ? null : replay + 1), done ? REPLAY_STEP_MS : replay === 0 ? 300 : REPLAY_STEP_MS);
    return () => clearTimeout(t);
    // `steps` only grows; re-running on its identity would restart the timer.
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [replay]);

  const select = (id) => {
    setReplay(null);
    setSelected(id);
    setFollow(id === latest);
    animated.current[id] = buildSteps(cycles, id).steps.length;
    setFlow(null);
  };
  const toggleFollow = (on) => {
    setFollow(on);
    if (on && latest && latest !== selected) select(latest);
  };

  return (
    <div className="app">
      <aside className="side">
        <div className="brand"><b>veil</b><span>what leaves your machine</span></div>
        <AskBox onStarted={() => { setReplay(null); setFollow(true); }} onRunning={setAskRunning} />
        <div className="tabs">
          {[["prompts", `Prompts (${turns.length})`], ["vault", `Vault (${scope ? vaultCount : 0})`], ["audit", `Audit log (${auditCount})`]].map(([id, label]) => (
            <button key={id} className={tab === id ? "on" : ""} onClick={() => setTab(id)}>{label}</button>
          ))}
        </div>
        <div className="tab-body">
          <div hidden={tab !== "prompts"}>
            {[...turns].reverse().map((id) => {
              const c = cycles[id];
              const t = (c.stages.tokenized && c.stages.tokenized.text) || (c.stages.received && c.stages.received.text) || "…";
              return (
                <button key={id} className={"turn" + (id === selected ? " sel" : "")} onClick={() => select(id)}>
                  <div className="p">{renderTokens(t)}</div>
                  <div className="m">{new Date(c.firstSeenAt).toLocaleTimeString()}</div>
                </button>
              );
            })}
            {!turns.length && <div className="muted">No prompts yet. Run one above.</div>}
          </div>
          <VaultPane hidden={tab !== "vault"} scope={scope} onCount={setVaultCount} />
          <AuditPane hidden={tab !== "audit"} rows={auditRows} scope={scope} />
        </div>
      </aside>
      <main className="main">
        <div className="top" style={view === "metrics" ? { paddingBottom: 0, borderBottom: "none" } : null}>
          <div className="bar">
            <div className="views">
              <button className={view === "flow" ? "on" : ""} onClick={() => setView("flow")}>Flow</button>
              <button className={view === "metrics" ? "on" : ""} onClick={() => setView("metrics")}>Metrics</button>
            </div>
            {view === "flow" && stats && <>
              <div className="stat good"><span className="v">{stats.tokens}</span><span className="l">values kept local</span></div>
              <div className="stat"><span className="v">{stats.tools}</span><span className="l">local tool calls</span></div>
              <div className="stat"><span className="v">{stats.rounds}</span><span className="l">API requests</span></div>
              <div className="stat"><span className="v">{inFlight || (askRunning && selected === latest) ? "running" : "done"}</span></div>
            </>}
            <span className="spacer" />
            {view === "flow" && <>
              <label className="follow"><input type="checkbox" checked={follow} onChange={(e) => toggleFollow(e.target.checked)} /> follow latest</label>
              <button className="primary" disabled={!steps.length || replay != null} onClick={() => setReplay(0)}>▶ Replay this prompt</button>
              {replay != null && <button onClick={() => setReplay(null)}>Stop</button>}
            </>}
          </div>
          <div hidden={view !== "flow"}>
          <Diagram flow={flow} />
          <div className="legend">
            <span><i style={{ background: "var(--regex)" }} />regex</span>
            <span><i style={{ background: "var(--llm)" }} />local LLM</span>
            <span><i style={{ background: "var(--encoder)" }} />GLiNER</span>
            <span><i style={{ background: "var(--token)" }} />token</span>
            <span><i style={{ background: "var(--detoken)" }} />real value, resolved locally</span>
          </div>
          </div>
        </div>
        {view === "metrics" && <MetricsView />}
        <div className="steps" ref={stepsRef} hidden={view !== "flow"}>
          {!selected && <div className="empty">Type a prompt on the left. Each step appears here as it happens.</div>}
          {visible.map((s, i) => (
            <StepCard key={s.key} step={s} index={i} current={replay != null ? i === replay - 1 : i === visible.length - 1 && inFlight} />
          ))}
          {selected && inFlight && replay == null && (
            <div className="waiting"><span className="dot-pulse" /> waiting for the next step…</div>
          )}
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
