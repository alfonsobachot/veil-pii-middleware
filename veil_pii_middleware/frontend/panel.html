<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>veil — observability panel</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-border: #2a2e38;
    --text: #e6e8ec;
    --muted: #8a90a0;
    --regex: #4fb0ff;
    --llm: #ff9f4f;
    --token: #4fd48a;
    --detoken: #c792ea;
    --stage-idle: #262a34;
    --stage-active: #3a7bd5;
    --danger: #ff5c5c;
    --ok: #4fd48a;
  }
  * { box-sizing: border-box; }
  /* An author-defined `display` on an element (or, as happened here, on a
     child selector like `#bottom`) beats the browser's built-in
     `[hidden] { display: none }` default -- that's exactly the bug that
     made the Inspect tab's content show up on the Live tab too, since
     `#bottom`'s own `display: grid` won the cascade over `[hidden]`.
     `!important` here is the standard fix: it always wins regardless of
     what any other component-specific `display` rule declares, so `hidden`
     can be trusted to actually hide, everywhere, without auditing every
     rule that touches `display`. Toggle visibility via the `hidden` prop,
     never `style.display`. */
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 -apple-system, Segoe UI, sans-serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .tab-body {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; }
  header .sub { color: var(--muted); }

  #tabs { display: flex; gap: 4px; margin-left: auto; }
  .tab-btn {
    font: inherit;
    background: none;
    color: var(--muted);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .tab-btn.active { color: var(--text); border-color: var(--stage-active); background: var(--panel); }

  #cycle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 16px;
  }
  #cycle-selector {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    flex: 1 1 auto;
    min-width: 0;
  }
  .cycle-chip {
    font: inherit;
    background: var(--panel);
    color: var(--muted);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    white-space: nowrap;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cycle-chip.selected { color: var(--text); border-color: var(--stage-active); }
  .cycle-chip.in-flight { border-style: dashed; }
  .cycle-chip.internal-kind { opacity: 0.6; font-style: italic; }
  .cycle-empty { color: var(--muted); flex: 1 1 auto; }
  #show-internal-toggle {
    font: inherit;
    padding: 4px 10px;
    color: var(--muted);
    white-space: nowrap;
    flex: 0 0 auto;
  }
  #show-internal-toggle.active { color: var(--text); border-color: var(--stage-active); }

  /* The four panels stay the main content -- one
     scrolling Timeline sits in a left sidebar next to them, one entry per
     turn stage/hook marker/round, click-to-focus which round the panels
     show (see `#live-main`/`#panes` below). */
  #live-body {
    display: flex;
    flex: 1 1 auto;
    min-height: 0;
    gap: 12px;
    padding: 0 16px 16px;
  }
  #live-sidebar {
    flex: 0 0 300px;
    min-width: 0;
    overflow-y: auto;
    border-right: 1px solid var(--panel-border);
    padding-right: 12px;
  }
  #live-main {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    display: flex;
  }
  #timeline {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .timeline-empty { color: var(--muted); font-style: italic; }
  .timeline-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 6px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
  }
  .timeline-stage { flex-wrap: wrap; }
  .timeline-toggle {
    background: none;
    border: none;
    color: var(--text);
    font: inherit;
    cursor: pointer;
    padding: 0;
    flex: 1 1 auto;
    text-align: left;
  }
  .timeline-time { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .timeline-detail {
    flex-basis: 100%;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 6px 0 0;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12px;
    max-height: 240px;
    overflow-y: auto;
  }
  .timeline-hook { background: var(--stage-idle); }
  .timeline-hook.in-progress { border-color: var(--stage-active); }
  .timeline-label { flex: 1 1 auto; }
  .timeline-waiting { color: var(--muted); font-style: italic; border-style: dashed; }
  .timeline-spinner {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid var(--muted);
    border-top-color: var(--stage-active);
    animation: veil-spin 700ms linear infinite;
    flex: 0 0 auto;
  }
  @keyframes veil-spin { to { transform: rotate(360deg); } }

  #panes {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 12px;
    flex: 1 1 auto;
    min-height: 0;
    min-width: 0;
  }
  .pane {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .pane h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .pane pre {
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12px;
    flex: 1 1 auto;
    overflow-y: auto;
  }
  .pane-pending { color: var(--muted); font-style: italic; }
  .span-regex { background: color-mix(in srgb, var(--regex) 35%, transparent); border-radius: 2px; }
  .span-llm { background: color-mix(in srgb, var(--llm) 35%, transparent); border-radius: 2px; }
  .span-token { background: color-mix(in srgb, var(--token) 35%, transparent); border-radius: 2px; cursor: help; }
  .span-detoken { background: color-mix(in srgb, var(--detoken) 35%, transparent); border-radius: 2px; cursor: help; }

  #bottom {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 16px;
    flex: 1 1 auto;
    min-height: 0;
  }
  #bottom table { display: block; flex: 1 1 auto; overflow-y: auto; }
  #bottom thead, #bottom tbody tr { display: table; width: 100%; table-layout: fixed; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--panel-border); }
  th { color: var(--muted); font-weight: 500; }
  button {
    font: inherit;
    background: var(--stage-idle);
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 2px 8px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--stage-active); }
  button:disabled { opacity: 0.4; cursor: default; }
  .legend { display: flex; gap: 14px; color: var(--muted); padding: 0 16px; margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  #metrics-tab { padding: 16px; }
  .metrics-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

// Every raw pipeline-stream stage the server publishes, in order -- used
// wherever *all six* must be checked (e.g. `cycleIsComplete`), independent
// of how they're grouped for display below.
const STAGES = ["received", "tokenized", "forwarded", "response_received", "detokenized", "displayed"];

// A turn (one logical user request, however many gateway/tool
// round-trips it took) renders as one scrolling Timeline instead of a fixed
// six-box diagram for a single cycle -- see `buildTimelineEntries` below.
// Per-stage label/renderer, keyed by the same raw stage name the server
// publishes; `render` mirrors the earlier `Panes` component's own
// per-stage rendering so a stage's content looks the same, just reached by
// expanding its row instead of by stepping a fixed pipeline diagram.
// `render` optionally takes the same round's tokenized pre-image text (only
// meaningful for "detokenized"/"displayed", to diff-highlight substituted
// values -- see `renderDetokenizedText`); every other stage ignores it.
const STAGE_TIMELINE = {
  received: { label: "Input received", render: (s) => renderSpannedText(s.text || "", s.spans) },
  tokenized: { label: "Tokenized", render: (s) => renderTokenizedText(s.text || "") },
  forwarded: { label: "Forwarded to API", render: (s) => renderTokenizedText(s.text || "") },
  response_received: {
    label: "API response received",
    render: (s) => renderTokenizedText(s.text || ""),
  },
  detokenized: {
    label: "Detokenized",
    render: (s, sourceText) => renderDetokenizedText(s.text || "", sourceText),
  },
  displayed: {
    label: "Displayed to developer",
    render: (s, sourceText) => renderDetokenizedText(s.text || "", sourceText),
  },
};

const HOOK_LABEL = { pre_tool_use: "PreToolUse", post_tool_use: "PostToolUse" };
const HOOK_PHASE_LABEL = { start: "started", done: "done", error: "failed" };

const HISTORY_LIMIT = 20; // must match gateway_server.PIPELINE_HISTORY_LIMIT

// Cycle kinds gateway_server._classify_cycle_kind can tag a cycle with,
// hidden from the selector by default: real Claude Code requests, but
// neither is anything a human typed (a session-title-generation request;
// an agent-loop continuation turn whose only "new" content is a
// Claude-Code-injected <system-reminder> block). A "Show N hidden" toggle
// reveals them for anyone who wants to inspect them anyway.
const HIDDEN_KINDS = new Set(["title_generation", "safety_check", "internal_continuation"]);
const HIDDEN_KIND_LABEL = {
  title_generation: "session title request",
  safety_check: "internal safety check",
  internal_continuation: "internal agent-loop turn",
};

const TOKEN_RE = /PII_([A-Z]+)_\d{4}/g;

function renderTokenizedText(text) {
  // Splits on PII_<TYPE>_NNNN tokens so a hover can show the entity type
  // parsed straight out of the token itself -- no extra data needed. Colored
  // the same way as a tokenization-site marker (span-token), mirroring how
  // regex/LLM detections are colored on the "received" stage.
  const parts = [];
  let last = 0;
  let match;
  TOKEN_RE.lastIndex = 0;
  while ((match = TOKEN_RE.exec(text)) !== null) {
    if (match.index > last) parts.push(text.slice(last, match.index));
    parts.push(
      <span className="span-token" title={`tokenized: ${match[1]}`} key={match.index}>
        {match[0]}
      </span>
    );
    last = match.index + match[0].length;
  }
  parts.push(text.slice(last));
  return parts;
}

// Detokenization never ships its own spans (core/tokenizer.py's substitution
// is a plain regex replace -- see `_resolve_or_placeholder`), so the panel
// reconstructs which regions of the detokenized text are substituted values
// by diffing it against the same round's pre-image (the tokenized text one
// stage earlier, still carrying PII_<TYPE>_NNNN tokens). Every literal
// character *around* a token is untouched by detokenization, so each
// literal run from the pre-image is used as an anchor to find where the
// corresponding substituted value starts and ends in the result text.
function renderDetokenizedText(resultText, sourceText) {
  if (!sourceText) return resultText;
  TOKEN_RE.lastIndex = 0;
  const segments = [];
  let last = 0;
  let match;
  while ((match = TOKEN_RE.exec(sourceText)) !== null) {
    segments.push({ type: "literal", text: sourceText.slice(last, match.index) });
    segments.push({ type: "token", text: match[0], entityType: match[1] });
    last = match.index + match[0].length;
  }
  segments.push({ type: "literal", text: sourceText.slice(last) });
  if (!segments.some((s) => s.type === "token")) return resultText;

  const parts = [];
  let rPos = 0;
  let aligned = true;
  for (let i = 0; i < segments.length && aligned; i++) {
    const seg = segments[i];
    if (seg.type === "literal") {
      if (seg.text.length === 0) continue;
      if (!resultText.startsWith(seg.text, rPos)) {
        aligned = false; // detokenization altered the surrounding text more than expected
        break;
      }
      parts.push(resultText.slice(rPos, rPos + seg.text.length));
      rPos += seg.text.length;
      continue;
    }
    // Find the next non-empty literal anchor to bound this substituted
    // value; consecutive tokens with nothing between them fold into one
    // highlighted run since there is no anchor to split them on.
    let anchor = "";
    for (let j = i + 1; j < segments.length; j++) {
      if (segments[j].type === "literal" && segments[j].text.length > 0) {
        anchor = segments[j].text;
        break;
      }
    }
    const end = anchor ? resultText.indexOf(anchor, rPos) : resultText.length;
    if (end === -1) {
      aligned = false;
      break;
    }
    parts.push(
      <span className="span-detoken" title={`detokenized: ${seg.entityType}`} key={`d${i}`}>
        {resultText.slice(rPos, end)}
      </span>
    );
    rPos = end;
  }
  if (!aligned) return resultText; // fall back to plain text rather than mismarking
  if (rPos < resultText.length) parts.push(resultText.slice(rPos));
  return parts;
}

function renderSpannedText(text, spans) {
  if (!spans || spans.length === 0) return text;
  const sorted = [...spans].sort((a, b) => a.start - b.start);
  const parts = [];
  let last = 0;
  sorted.forEach((span, i) => {
    if (span.start > last) parts.push(text.slice(last, span.start));
    const cls = span.detector === "LLM" ? "span-llm" : "span-regex";
    parts.push(
      <span className={cls} title={`${span.entity_type} (${span.detector})`} key={i}>
        {text.slice(span.start, span.end)}
      </span>
    );
    last = span.end;
  });
  parts.push(text.slice(last));
  return parts;
}

function useEventSource(path, onEvent) {
  const handlerRef = useRef(onEvent);
  handlerRef.current = onEvent;
  useEffect(() => {
    const source = new EventSource(path);
    source.onmessage = (ev) => {
      try {
        handlerRef.current(JSON.parse(ev.data));
      } catch (err) {
        // A malformed line is skipped, never crashes the panel.
      }
    };
    return () => source.close();
  }, [path]);
}

function cyclePreview(cycle) {
  const text = (cycle.stages.received && cycle.stages.received.text) || "";
  const trimmed = text.slice(0, 36);
  const preview = trimmed ? trimmed + (text.length > 36 ? "…" : "") : "(no input text yet)";
  const kindLabel = HIDDEN_KIND_LABEL[cycle.kind];
  return kindLabel ? `[${kindLabel}] ${preview}` : preview;
}

function cycleIsComplete(cycle) {
  return STAGES.every((stage) => cycle.stages[stage]);
}

// A cycle is its own top-level turn (gets a chip) unless it is
// a tool_result continuation whose parent turn is still around in `cycles`
// -- the documented fallback for an orphaned continuation (no parent ever
// seen, or the parent has since been evicted from the ring buffer) is to
// keep showing it standalone rather than silently hide content nowhere
// else in the panel shows.
function isTopLevelCycle(cycle, cycles) {
  if (!cycle) return false;
  // Revised after live testing: a cycle folds into another
  // turn's timeline whenever it has a *resolvable* parent, regardless of
  // its own kind -- not just a "tool_continuation" child, but also a
  // same-text sibling "conversation" cycle the turn-tracking merged in
  // (see gateway_server.PipelineEventBus's own "Turn tracking" docstring).
  // An unresolvable parent (evicted, or none was ever open) is the
  // documented orphan fallback: still its own visible chip.
  if (!cycle.parentRequestId) return true;
  return !cycles[cycle.parentRequestId];
}

// A turn (its own cycle plus any child cycles/hook events folded into it)
// is still in flight while its last round hasn't completed all six stages,
// or a hook step is currently between "start" and its "done"/"error".
function isTurnInFlight(cycles, turnRequestId) {
  return buildTimelineEntries(cycles, turnRequestId).some(
    (entry) => entry.type === "waiting" || (entry.type === "hook" && entry.inProgress)
  );
}

function CycleSelector({ order, cycles, selectedRequestId, onSelect, hiddenCount, showInternal, onToggleShowInternal }) {
  return (
    <div id="cycle-row">
      {order.length === 0 ? (
        <p className="cycle-empty">No requests observed yet -- run one through the gateway.</p>
      ) : (
        <div id="cycle-selector">
          {[...order].reverse().map((requestId) => {
            const cycle = cycles[requestId];
            if (!cycle) return null;
            const classes = ["cycle-chip"];
            if (requestId === selectedRequestId) classes.push("selected");
            if (isTurnInFlight(cycles, requestId)) classes.push("in-flight");
            if (HIDDEN_KINDS.has(cycle.kind)) classes.push("internal-kind");
            return (
              <button
                key={requestId}
                className={classes.join(" ")}
                title={cyclePreview(cycle)}
                onClick={() => onSelect(requestId)}
              >
                {cyclePreview(cycle)}
              </button>
            );
          })}
        </div>
      )}
      {(hiddenCount > 0 || showInternal) && (
        <button
          id="show-internal-toggle"
          className={showInternal ? "active" : ""}
          title={
            showInternal
              ? "Hide session-title / internal-agent-loop cycles"
              : `Show ${hiddenCount} hidden session-title / internal-agent-loop cycle${hiddenCount === 1 ? "" : "s"}`
          }
          onClick={onToggleShowInternal}
        >
          Show hidden
        </button>
      )}
    </div>
  );
}

// One logical user turn can now span several raw gateway
// cycles (the turn's own, plus zero or more tool_continuation children
// chained onto it) plus hook progress markers reported in between. This
// builds one chronologically-sorted list mixing all three, replacing the
// old fixed six-stage-diagram-for-one-cycle view.
// The turn's own cycle plus every child cycle folded into it (a
// tool_continuation, or a same-text sibling "conversation" the revised
// turn-tracking merges in) -- shared by `buildTimelineEntries`
// and `LiveTab`'s own "which round do the four panes show" logic, so both
// always agree on the same round order.
function getRoundIds(cycles, turnRequestId) {
  const childIds = Object.keys(cycles).filter(
    (id) => id !== turnRequestId && cycles[id].parentRequestId === turnRequestId
  );
  return [turnRequestId, ...childIds];
}

function buildTimelineEntries(cycles, turnRequestId) {
  const turn = cycles[turnRequestId];
  if (!turn) return [];
  const roundIds = getRoundIds(cycles, turnRequestId);
  const entries = [];
  roundIds.forEach((id, roundIndex) => {
    const cycle = cycles[id];
    STAGES.forEach((stageName) => {
      const stageEvent = cycle.stages[stageName];
      if (!stageEvent) return;
      // Both stages that resolve tokens back to real values share the same
      // round's tokenized pre-image as their diff anchor: "response_received"
      // is the last stage still carrying PII_<TYPE>_NNNN tokens before
      // "detokenized" resolves them, and "displayed" is always that same
      // resolved text (see server.py's out_text reuse), so it reuses the
      // identical anchor rather than "detokenized" itself.
      const sourceText =
        stageName === "detokenized" || stageName === "displayed"
          ? cycle.stages.response_received && cycle.stages.response_received.text
          : undefined;
      entries.push({
        type: "stage",
        key: `${id}:${stageName}`,
        roundRequestId: id,
        roundIndex,
        roundKind: cycle.kind,
        stage: stageName,
        stageEvent,
        sourceText,
        timestamp: stageEvent.timestamp,
      });
    });
    (cycle.hookEvents || []).forEach((hookEvent, i) => {
      entries.push({
        type: "hook",
        key: `${id}:hook:${i}:${hookEvent.hook}:${hookEvent.phase}`,
        roundRequestId: id,
        roundIndex,
        roundKind: cycle.kind,
        hookEvent,
        timestamp: hookEvent.timestamp,
      });
    });
  });
  entries.sort((a, b) => (a.timestamp < b.timestamp ? -1 : a.timestamp > b.timestamp ? 1 : 0));

  // A hook "start" with no later "done"/"error" for the same (hook,
  // tool_name) pair is still in flight -- this is what makes the actual
  // local DB round-trip's duration visible live.
  entries.forEach((entry, i) => {
    if (entry.type !== "hook" || entry.hookEvent.phase !== "start") return;
    const { hook, tool_name } = entry.hookEvent;
    entry.inProgress = !entries
      .slice(i + 1)
      .some(
        (e) =>
          e.type === "hook" &&
          e.hookEvent.hook === hook &&
          e.hookEvent.tool_name === tool_name &&
          e.hookEvent.phase !== "start"
      );
  });

  const lastRoundId = roundIds[roundIds.length - 1];
  if (!cycleIsComplete(cycles[lastRoundId])) {
    entries.push({ type: "waiting", key: `${lastRoundId}:waiting` });
  }
  return entries;
}

function TimelineRow({ entry, isOpen, onToggle }) {
  if (entry.type === "waiting") {
    return (
      <div className="timeline-row timeline-waiting">
        <span className="timeline-spinner" /> Waiting for the next stage…
      </div>
    );
  }
  if (entry.type === "hook") {
    const { hook, phase, tool_name, timestamp } = entry.hookEvent;
    return (
      <div className={"timeline-row timeline-hook" + (entry.inProgress ? " in-progress" : "")}>
        {entry.inProgress && <span className="timeline-spinner" />}
        <span className="timeline-label">
          {(HOOK_LABEL[hook] || hook) + ": " + (HOOK_PHASE_LABEL[phase] || phase)} ({tool_name})
        </span>
        <span className="timeline-time">{timestamp.slice(11, 19)}</span>
      </div>
    );
  }
  const info = STAGE_TIMELINE[entry.stage];
  // A round beyond the first is either a tool_result continuation or a
  // same-text sibling conversation the turn-tracking merged in (revised
  // after live testing) -- label it honestly either way.
  const roundPrefix =
    entry.roundIndex === 0
      ? ""
      : entry.roundKind === "tool_continuation"
        ? `Tool round ${entry.roundIndex}: `
        : `Round ${entry.roundIndex} (repeated request): `;
  return (
    <div className="timeline-row timeline-stage">
      <button className="timeline-toggle" onClick={onToggle}>
        {isOpen ? "▾" : "▸"} {roundPrefix}
        {info.label}
      </button>
      <span className="timeline-time">{entry.stageEvent.timestamp.slice(11, 19)}</span>
      {isOpen && (
        <pre className="timeline-detail">{info.render(entry.stageEvent, entry.sourceText)}</pre>
      )}
    </div>
  );
}

// Purely an inspection tool: expanding a row here shows that exact round's
// raw request/response text inline, but never changes what the four main
// panels show -- those always represent the *turn's* own boundary (its
// original input, its final answer), not whichever round happens to be
// expanded here. See `LiveTab`'s `firstRoundCycle`/`lastRoundCycle`.
function Timeline({ turnRequestId, cycles }) {
  const [expanded, setExpanded] = useState(() => new Set());
  const toggle = (key) =>
    setExpanded((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key);
      else next.add(key);
      return next;
    });

  if (!turnRequestId) {
    return <p className="timeline-empty">Select or run a request to begin.</p>;
  }
  const entries = buildTimelineEntries(cycles, turnRequestId);
  if (entries.length === 0) {
    return <p className="timeline-empty">Waiting for the first stage…</p>;
  }
  return (
    <div id="timeline">
      {entries.map((entry) => (
        <TimelineRow
          key={entry.key}
          entry={entry}
          isOpen={expanded.has(entry.key)}
          onToggle={() => toggle(entry.key)}
        />
      ))}
    </div>
  );
}

// The four panels represent the *turn's* own boundary, not whichever round
// is expanded in the sidebar (second revision, per explicit
// human request): panel 1/2 always come from the turn's own first round
// (what the human actually typed, and that same text tokenized) and panel
// 3/4 always come from the turn's latest completed round (the final answer
// as the API sent it, and that same answer resolved for the developer to
// read) -- fixed reference points a multi-tool-round turn still has exactly
// one of each, regardless of how many intermediate rounds happened between.
function Panes({ firstCycle, lastCycle }) {
  const inputStages = firstCycle ? firstCycle.stages : {};
  const outputStages = lastCycle ? lastCycle.stages : {};
  const pending = <span className="pane-pending">not reached yet</span>;
  return (
    <div id="panes">
      <div className="pane">
        <h2>1. Input</h2>
        <pre>
          {inputStages.received
            ? renderSpannedText(inputStages.received.text || "", inputStages.received.spans)
            : pending}
        </pre>
      </div>
      <div className="pane">
        <h2>2. Outbound to API</h2>
        <pre>
          {inputStages.forwarded || inputStages.tokenized
            ? renderTokenizedText((inputStages.forwarded || inputStages.tokenized).text || "")
            : pending}
        </pre>
      </div>
      <div className="pane">
        <h2>3. API response</h2>
        <pre>
          {outputStages.response_received
            ? renderTokenizedText(outputStages.response_received.text || "")
            : pending}
        </pre>
      </div>
      <div className="pane">
        <h2>4. Developer view</h2>
        <pre>
          {outputStages.displayed || outputStages.detokenized
            ? renderDetokenizedText(
                (outputStages.displayed || outputStages.detokenized).text || "",
                outputStages.response_received && outputStages.response_received.text
              )
            : pending}
        </pre>
      </div>
    </div>
  );
}

const MAX_AUDIT_ROWS = 50;

function AuditLogPane() {
  // Consumes /veil-panel/audit-stream directly (by design, "a panel that
  // consumes the audit log over SSE") -- structurally separate from the
  // pipeline-stream feeding the four panes above: every row here is exactly
  // what core/audit.py ever writes (token, type, detector, offset, adapter,
  // a value *hash*) and never the value itself, unlike the pipeline stream.
  const [entries, setEntries] = useState([]);

  useEventSource("/veil-panel/audit-stream", (entry) => {
    setEntries((prev) => [entry, ...prev].slice(0, MAX_AUDIT_ROWS));
  });

  return (
    <div className="pane">
      <h2>Audit log (live, no values — {entries.length} of this session)</h2>
      <table>
        <thead>
          <tr><th>Time</th><th>Adapter</th><th>Type</th><th>Detector</th><th>Token</th></tr>
        </thead>
        <tbody>
          {entries.map((e, i) => (
            <tr key={`${e.token}-${e.timestamp}-${i}`}>
              <td>{new Date(e.timestamp).toLocaleTimeString()}</td>
              <td>{e.adapter}</td>
              <td>{e.entity_type}</td>
              <td>{e.detector}</td>
              <td>{e.token}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// Keys the `revealed` map by session+token, not token alone -- two different
// sessions legitimately mint the same token name (e.g. both have their own
// PII_EMAIL_0001), so a bare-token key would leak one session's revealed
// value onto another session's identically-named row.
function revealKey(sessionId, token) {
  return `${sessionId}␀${token}`;
}

function VaultInspector() {
  const [mappings, setMappings] = useState([]);
  const [defaultSessionId, setDefaultSessionId] = useState("");
  const [revealed, setRevealed] = useState({});

  const refresh = useCallback(() => {
    fetch("/veil-panel/vault")
      .then((r) => r.json())
      .then((data) => {
        setMappings(data.mappings || []);
        setDefaultSessionId(data.default_session_id || "");
      })
      .catch(() => {});
  }, []);

  useEffect(() => {
    refresh();
    const id = setInterval(refresh, 4000);
    return () => clearInterval(id);
  }, [refresh]);

  const reveal = (sessionId, token) => {
    fetch("/veil-panel/vault/reveal", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, session_id: sessionId }),
    })
      .then((r) => r.json())
      .then((data) =>
        setRevealed((prev) => ({ ...prev, [revealKey(sessionId, token)]: data.value ?? data.error }))
      );
  };

  const hide = (sessionId, token) => {
    setRevealed((prev) => {
      const next = { ...prev };
      delete next[revealKey(sessionId, token)];
      return next;
    });
  };

  const sessionCount = new Set(mappings.map((m) => m.session_id)).size;

  return (
    <div className="pane">
      <h2>
        Vault inspector — {mappings.length} token{mappings.length === 1 ? "" : "s"} across{" "}
        {sessionCount} session{sessionCount === 1 ? "" : "s"}
      </h2>
      <table>
        <thead>
          <tr><th>Token</th><th>Type</th><th>Session</th><th>Ciphertext</th><th>Created</th><th></th></tr>
        </thead>
        <tbody>
          {mappings.map((m) => {
            const key = revealKey(m.session_id, m.token);
            return (
              <tr key={key}>
                <td>{m.token}</td>
                <td>{m.entity_type}</td>
                <td title={m.session_id}>{m.session_id.slice(0, 12)}&hellip;</td>
                <td title={m.ciphertext_b64}>{m.ciphertext_b64.slice(0, 12)}&hellip;</td>
                <td>{new Date(m.created_at * 1000).toLocaleTimeString()}</td>
                <td>
                  {revealed[key] !== undefined ? (
                    <>
                      <code>{revealed[key]}</code>{" "}
                      <button onClick={() => hide(m.session_id, m.token)}>Hide</button>
                    </>
                  ) : (
                    <button onClick={() => reveal(m.session_id, m.token)}>Reveal</button>
                  )}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function ModeReport({ mode, report }) {
  const timing =
    report && report.available && report.cells
      ? `${report.seconds.toFixed(1)} s total · ${((1000 * report.seconds) / report.cells).toFixed(1)} ms per cell`
      : null;
  return (
    <div className="pane">
      <h2>{mode}</h2>
      {timing && <p className="sub">{timing}</p>}
      {report && report.model && <p className="sub">{report.model}</p>}
      {!report ? (
        <p>&hellip;</p>
      ) : !report.available ? (
        <p>unavailable: {report.reason}</p>
      ) : (
        <>
          <table>
            <thead>
              <tr><th>Entity</th><th>Support</th><th>Found</th><th>FP</th><th>Recall</th><th>Precision</th></tr>
            </thead>
            <tbody>
              {Object.entries(report.by_type).map(([name, m]) => (
                <tr key={name}>
                  <td>{name}</td>
                  <td>{m.support}</td>
                  <td>{m.true_positives}</td>
                  <td>{m.false_positives}</td>
                  <td>{m.recall.toFixed(3)}</td>
                  <td>{m.precision.toFixed(3)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          {Object.keys(report.by_detector).length > 0 && (
            <table>
              <thead><tr><th>Detector</th><th>Found</th><th>FP</th></tr></thead>
              <tbody>
                {Object.entries(report.by_detector).map(([name, m]) => (
                  <tr key={name}>
                    <td>{name}</td>
                    <td>{m.true_positives}</td>
                    <td>{m.false_positives}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </>
      )}
    </div>
  );
}

function MetricsTab() {
  // Regex/LLM/union comparison. The llm/union modes are
  // genuinely expensive (one real LLM call per manifest entry), so this
  // never runs on its own -- it shows whatever was last persisted to
  // `.veil/metrics_comparison.json` (surviving a gateway restart) until
  // "Run comparison" is pressed explicitly.
  const [comparison, setComparison] = useState(null);
  const [running, setRunning] = useState(false);
  const [error, setError] = useState(null);

  const load = useCallback(() => {
    fetch("/veil-panel/metrics/comparison")
      .then((r) => r.json())
      .then(setComparison)
      .catch(() => {});
  }, []);

  useEffect(() => {
    load();
  }, [load]);

  const run = () => {
    setRunning(true);
    setError(null);
    fetch("/veil-panel/metrics/comparison", { method: "POST" })
      .then((r) => r.json())
      .then((data) => {
        setComparison(data);
        setRunning(false);
      })
      .catch((err) => {
        setError(String(err));
        setRunning(false);
      });
  };

  const hasResult = comparison && comparison.available;

  return (
    <div id="metrics-tab">
      <div className="metrics-header">
        <button onClick={run} disabled={running}>{running ? "Running…" : "Run comparison"}</button>
        {hasResult && (
          <span className="sub">last run at {new Date(comparison.generated_at).toLocaleString()}</span>
        )}
        {!hasResult && !running && <span className="sub">no comparison has been run yet</span>}
        {running && <span className="sub">running regex + LLM + union against the manifest&hellip;</span>}
        {error && <span className="sub" style={{ color: "var(--danger)" }}>{error}</span>}
      </div>
      {hasResult && (
        <div className="mode-grid">
          <ModeReport mode="regex" report={comparison.modes.regex} />
          <ModeReport mode="llm" report={comparison.modes.llm} />
          <ModeReport mode="union" report={comparison.modes.union} />
        </div>
      )}
      {hasResult && comparison.encoder && (
        <>
          <h2 style={{ marginTop: "24px" }}>Encoder NER (alternative soft layer)</h2>
          <div className="mode-grid">
            <ModeReport mode="regex + encoder" report={comparison.encoder} />
          </div>
        </>
      )}
    </div>
  );
}

function LiveTab({ hidden }) {
  const [cycles, setCycles] = useState({});
  // Revised after live testing: two independent, independently-
  // capped orders, mirroring gateway_server.PipelineEventBus's own
  // `_order`/`_aux_order` split -- a burst of hidden-kind cycles (Claude
  // Code's own internal safety-classifier calls, observed live firing once
  // per tool call) must never be able to push a real, still-relevant turn
  // out of `order`'s own client-side HISTORY_LIMIT.
  const [order, setOrder] = useState([]);
  const [auxOrder, setAuxOrder] = useState([]);
  const [selectedRequestId, setSelectedRequestId] = useState(null);
  const [pinnedToLatest, setPinnedToLatest] = useState(true);
  const [showInternal, setShowInternal] = useState(false);

  const knownRequestIdsRef = useRef(new Set());
  const pinnedToLatestRef = useRef(true);
  useEffect(() => {
    pinnedToLatestRef.current = pinnedToLatest;
  }, [pinnedToLatest]);

  useEventSource("/veil-panel/pipeline-stream", (event) => {
    const { request_id, stage, text, spans, timestamp, kind, parent_request_id } = event;
    const isNewCycle = !knownRequestIdsRef.current.has(request_id);
    knownRequestIdsRef.current.add(request_id);

    setCycles((prev) => {
      const existing = prev[request_id];
      const stages = stage
        ? { ...(existing ? existing.stages : {}), [stage]: { text, spans, timestamp } }
        : existing
          ? existing.stages
          : {};
      const hookEvents =
        kind === "hook"
          ? [...(existing ? existing.hookEvents || [] : []), { ...event }]
          : existing
            ? existing.hookEvents || []
            : [];
      return {
        ...prev,
        [request_id]: {
          requestId: request_id,
          stages,
          hookEvents,
          kind: kind || (existing ? existing.kind : undefined) || "conversation",
          parentRequestId: parent_request_id || (existing ? existing.parentRequestId : null) || null,
          firstSeenAt: existing ? existing.firstSeenAt : timestamp,
        },
      };
    });

    if (kind === "hook") return; // rides along on an already-known request_id; never a new chip

    const isAuxiliaryKind = HIDDEN_KINDS.has(kind || "conversation");
    (isAuxiliaryKind ? setAuxOrder : setOrder)((prev) => {
      if (prev.includes(request_id)) return prev;
      const next = [...prev, request_id];
      if (next.length > HISTORY_LIMIT) {
        const dropped = next.slice(0, next.length - HISTORY_LIMIT);
        dropped.forEach((id) => knownRequestIdsRef.current.delete(id));
        return next.slice(next.length - HISTORY_LIMIT);
      }
      return next;
    });

    if (isNewCycle) {
      // Pinning to "latest" only ever follows a cycle that would get its
      // own chip: a real conversational turn, or an orphaned
      // tool_continuation with no resolvable parent (the
      // documented fallback) -- never a hidden session-title/internal-
      // agent-loop cycle, and never a tool_continuation that is about to
      // fold into an already-visible parent turn's timeline instead of
      // becoming a chip of its own.
      const isHiddenKind = !showInternal && isAuxiliaryKind;
      // `knownRequestIdsRef` (a plain ref, updated synchronously above) is
      // used here rather than `cycles` state -- a burst of backlog events
      // is processed synchronously, faster than a state update's own
      // render+effect round trip could keep a ref derived from `cycles` in
      // sync, which previously caused a freshly-arrived child's parent to
      // look not-yet-known even though its own "received" event had
      // already been processed earlier in the very same burst.
      // The server only ever sets `parent_request_id`
      // when this cycle really does fold into another turn -- a
      // tool_continuation child, or a same-text sibling "conversation" the
      // turn-tracking merged in -- so no `kind` check is needed here.
      const isChildOfKnownParent =
        parent_request_id && knownRequestIdsRef.current.has(parent_request_id);
      if (pinnedToLatestRef.current && !isHiddenKind && !isChildOfKnownParent) {
        setSelectedRequestId(request_id);
      }
    }
  });

  const visibleOrder = (showInternal ? [...order, ...auxOrder] : order).filter((id) =>
    isTopLevelCycle(cycles[id], cycles)
  );
  const hiddenCount = auxOrder.length;

  const selectCycle = (requestId) => {
    setSelectedRequestId(requestId);
    setPinnedToLatest(
      visibleOrder.length > 0 && requestId === visibleOrder[visibleOrder.length - 1]
    );
  };

  // The four panels' fixed reference points: the turn's own first round
  // (the human's actual input) and its latest completed round (the final
  // answer) -- never whichever round happens to be expanded in the
  // sidebar. "Completed" here just means "has a response_received stage
  // yet"; an in-flight last round simply leaves panel 3/4 at "not reached
  // yet" until it does, same as before.
  const roundIds = selectedRequestId ? getRoundIds(cycles, selectedRequestId) : [];
  const firstRoundCycle = selectedRequestId ? cycles[selectedRequestId] : null;
  const lastRoundCycle =
    roundIds.length > 0 ? cycles[roundIds[roundIds.length - 1]] : null;

  return (
    <div hidden={hidden} className="tab-body">
      <CycleSelector
        order={visibleOrder}
        cycles={cycles}
        selectedRequestId={selectedRequestId}
        onSelect={selectCycle}
        hiddenCount={hiddenCount}
        showInternal={showInternal}
        onToggleShowInternal={() => setShowInternal((prev) => !prev)}
      />
      <div id="live-body">
        <div id="live-sidebar">
          <Timeline turnRequestId={selectedRequestId} cycles={cycles} />
        </div>
        <div id="live-main">
          <Panes firstCycle={firstRoundCycle} lastCycle={lastRoundCycle} />
        </div>
      </div>
    </div>
  );
}

function InspectTab({ hidden }) {
  return (
    <div hidden={hidden} className="tab-body">
      <div id="bottom">
        <AuditLogPane />
        <VaultInspector />
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("live");

  return (
    <div id="app">
      <header>
        <h1>veil — observability panel</h1>
        <span className="sub">
          live session
        </span>
        <div id="tabs">
          <button className={"tab-btn" + (tab === "live" ? " active" : "")} onClick={() => setTab("live")}>
            Live
          </button>
          <button className={"tab-btn" + (tab === "inspect" ? " active" : "")} onClick={() => setTab("inspect")}>
            Inspect
          </button>
          <button className={"tab-btn" + (tab === "metrics" ? " active" : "")} onClick={() => setTab("metrics")}>
            Metrics
          </button>
        </div>
      </header>
      {tab === "live" && (
        <div className="legend">
          <span><span className="swatch" style={{ background: "var(--regex)" }}></span> regex-detected span</span>
          <span><span className="swatch" style={{ background: "var(--llm)" }}></span> LLM-detected span</span>
          <span><span className="swatch" style={{ background: "var(--token)" }}></span> tokenized (substituted to token)</span>
          <span><span className="swatch" style={{ background: "var(--detoken)" }}></span> detokenized (token resolved back)</span>
        </div>
      )}
      <LiveTab hidden={tab !== "live"} />
      <InspectTab hidden={tab !== "inspect"} />
      {tab === "metrics" && <MetricsTab />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
