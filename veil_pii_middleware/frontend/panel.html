<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>veil — observability panel</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-border: #2a2e38;
    --text: #e6e8ec;
    --muted: #8a90a0;
    --regex: #4fb0ff;
    --llm: #ff9f4f;
    --stage-idle: #262a34;
    --stage-active: #3a7bd5;
    --danger: #ff5c5c;
    --ok: #4fd48a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 -apple-system, Segoe UI, sans-serif;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; }
  header .sub { color: var(--muted); }

  #tabs { display: flex; gap: 4px; margin-left: auto; }
  .tab-btn {
    font: inherit;
    background: none;
    color: var(--muted);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .tab-btn.active { color: var(--text); border-color: var(--stage-active); background: var(--panel); }

  #cycle-selector {
    display: flex;
    gap: 6px;
    padding: 10px 16px 0;
    overflow-x: auto;
  }
  .cycle-chip {
    font: inherit;
    background: var(--panel);
    color: var(--muted);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    white-space: nowrap;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cycle-chip.selected { color: var(--text); border-color: var(--stage-active); }
  .cycle-chip.in-flight { border-style: dashed; }
  .cycle-chip.internal-kind { opacity: 0.6; font-style: italic; }
  .cycle-empty { color: var(--muted); padding: 10px 16px 0; }
  #show-internal-toggle { margin: 6px 16px 0; font-size: 12px; color: var(--muted); }

  #pipeline {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 16px 16px 4px;
    overflow-x: auto;
  }
  .stage-box {
    flex: 0 0 auto;
    padding: 8px 12px;
    border-radius: 6px;
    background: var(--stage-idle);
    border: 1px solid var(--panel-border);
    white-space: nowrap;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .stage-box.active {
    background: var(--stage-active);
    border-color: var(--stage-active);
    color: #fff;
  }
  .stage-box.pending { opacity: 0.4; }
  .arrow { color: var(--muted); }

  #stage-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 16px 12px;
  }
  #stage-caption { color: var(--muted); padding: 0 16px 12px; min-height: 1.2em; }

  #panes {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 0 16px 16px;
  }
  .pane {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px 12px;
    min-height: 140px;
  }
  .pane h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .pane pre {
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12px;
  }
  .pane-pending { color: var(--muted); font-style: italic; }
  .span-regex { background: color-mix(in srgb, var(--regex) 35%, transparent); border-radius: 2px; }
  .span-llm { background: color-mix(in srgb, var(--llm) 35%, transparent); border-radius: 2px; }
  .token { text-decoration: underline dotted var(--muted); cursor: help; }

  #bottom {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 16px 16px;
  }
  #bottom table { display: block; max-height: 220px; overflow-y: auto; }
  #bottom thead, #bottom tbody tr { display: table; width: 100%; table-layout: fixed; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--panel-border); }
  th { color: var(--muted); font-weight: 500; }
  button {
    font: inherit;
    background: var(--stage-idle);
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 2px 8px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--stage-active); }
  button:disabled { opacity: 0.4; cursor: default; }
  .legend { display: flex; gap: 14px; color: var(--muted); padding: 0 16px 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  #metrics-tab { padding: 16px; }
  .metrics-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

const STAGES = ["received", "tokenized", "forwarded", "response_received", "detokenized", "displayed"];
const STAGE_LABEL = {
  received: "Received",
  tokenized: "Tokenized",
  forwarded: "Forwarded upstream",
  response_received: "Response received",
  detokenized: "Detokenized",
  displayed: "Displayed",
};
// One line per stage explaining what it does -- shown as the step-through
// caption, since the real cycle happens far too fast to read live (BRIEF's
// own "timebox this" warning, and the reason this walkthrough exists).
const STAGE_EXPLANATION = {
  received: "The gateway reads the raw request and scans it for PII spans (regex + LLM layers).",
  tokenized: "Every detected span is replaced with a stable PII_<TYPE>_<NNNN> vault token.",
  forwarded: "The tokenized body is sent to the real Anthropic API -- no raw PII ever leaves this machine.",
  response_received: "The model's response arrives, potentially echoing a token back.",
  detokenized: "Any token the model echoed is resolved back to its real value.",
  displayed: "The fully-resolved response reaches the developer's terminal.",
};

// Which stage index must have been reached before each pane has anything
// to show -- mirrors which pipeline event first populates that pane's text.
const PANE_STAGE_INDEX = { input: 0, outbound: 1, response: 3, developer: 4 };

const HISTORY_LIMIT = 20; // must match gateway_server.PIPELINE_HISTORY_LIMIT
const PLAY_INTERVAL_MS = 900;

// Cycle kinds gateway_server._classify_cycle_kind can tag a cycle with,
// hidden from the selector by default: real Claude Code requests, but
// neither is anything a human typed (a session-title-generation request;
// an agent-loop continuation turn whose only "new" content is a
// Claude-Code-injected <system-reminder> block). A "Show N hidden" toggle
// reveals them for anyone who wants to inspect them anyway.
const HIDDEN_KINDS = new Set(["title_generation", "internal_continuation"]);
const HIDDEN_KIND_LABEL = {
  title_generation: "session title request",
  internal_continuation: "internal agent-loop turn",
};

const TOKEN_RE = /PII_([A-Z]+)_\d{4}/g;

function renderTokenizedText(text) {
  // Splits on PII_<TYPE>_NNNN tokens so a hover can show the entity type
  // parsed straight out of the token itself -- no extra data needed.
  const parts = [];
  let last = 0;
  let match;
  TOKEN_RE.lastIndex = 0;
  while ((match = TOKEN_RE.exec(text)) !== null) {
    if (match.index > last) parts.push(text.slice(last, match.index));
    parts.push(
      <span className="token" title={`entity type: ${match[1]}`} key={match.index}>
        {match[0]}
      </span>
    );
    last = match.index + match[0].length;
  }
  parts.push(text.slice(last));
  return parts;
}

function renderSpannedText(text, spans) {
  if (!spans || spans.length === 0) return text;
  const sorted = [...spans].sort((a, b) => a.start - b.start);
  const parts = [];
  let last = 0;
  sorted.forEach((span, i) => {
    if (span.start > last) parts.push(text.slice(last, span.start));
    const cls = span.detector === "LLM" ? "span-llm" : "span-regex";
    parts.push(
      <span className={cls} title={`${span.entity_type} (${span.detector})`} key={i}>
        {text.slice(span.start, span.end)}
      </span>
    );
    last = span.end;
  });
  parts.push(text.slice(last));
  return parts;
}

function useEventSource(path, onEvent) {
  const handlerRef = useRef(onEvent);
  handlerRef.current = onEvent;
  useEffect(() => {
    const source = new EventSource(path);
    source.onmessage = (ev) => {
      try {
        handlerRef.current(JSON.parse(ev.data));
      } catch (err) {
        // A malformed line is skipped, never crashes the panel.
      }
    };
    return () => source.close();
  }, [path]);
}

function cyclePreview(cycle) {
  const text = (cycle.stages.received && cycle.stages.received.text) || "";
  const trimmed = text.slice(0, 36);
  const preview = trimmed ? trimmed + (text.length > 36 ? "…" : "") : "(no input text yet)";
  const kindLabel = HIDDEN_KIND_LABEL[cycle.kind];
  return kindLabel ? `[${kindLabel}] ${preview}` : preview;
}

function cycleIsComplete(cycle) {
  return STAGES.every((stage) => cycle.stages[stage]);
}

function CycleSelector({ order, cycles, selectedRequestId, onSelect, hiddenCount, showInternal, onToggleShowInternal }) {
  return (
    <>
      {order.length === 0 ? (
        <p className="cycle-empty">No requests observed yet -- run one through the gateway.</p>
      ) : (
        <div id="cycle-selector">
          {[...order].reverse().map((requestId) => {
            const cycle = cycles[requestId];
            if (!cycle) return null;
            const classes = ["cycle-chip"];
            if (requestId === selectedRequestId) classes.push("selected");
            if (!cycleIsComplete(cycle)) classes.push("in-flight");
            if (HIDDEN_KINDS.has(cycle.kind)) classes.push("internal-kind");
            return (
              <button
                key={requestId}
                className={classes.join(" ")}
                title={cyclePreview(cycle)}
                onClick={() => onSelect(requestId)}
              >
                {cyclePreview(cycle)}
              </button>
            );
          })}
        </div>
      )}
      {(hiddenCount > 0 || showInternal) && (
        <button id="show-internal-toggle" onClick={onToggleShowInternal}>
          {showInternal
            ? "Hide session-title / internal-agent-loop cycles"
            : `Show ${hiddenCount} hidden session-title / internal-agent-loop cycle${hiddenCount === 1 ? "" : "s"}`}
        </button>
      )}
    </>
  );
}

function Pipeline({ viewedStage, stagesPresent }) {
  return (
    <div id="pipeline">
      {STAGES.map((stage, i) => (
        <React.Fragment key={stage}>
          {i > 0 && <span className="arrow">&#8594;</span>}
          <div
            className={
              "stage-box" +
              (stage === viewedStage ? " active" : "") +
              (stagesPresent.includes(stage) ? "" : " pending")
            }
          >
            {STAGE_LABEL[stage]}
          </div>
        </React.Fragment>
      ))}
    </div>
  );
}

function StageControls({ viewedStageIndex, latestStageIndex, isComplete, isPlaying, onPrev, onNext, onPlayToggle, onJumpToLatest, pinnedToLatest }) {
  return (
    <div id="stage-controls">
      <button onClick={onPrev} disabled={viewedStageIndex <= 0}>&#8592; Prev</button>
      <button onClick={onNext} disabled={viewedStageIndex >= latestStageIndex}>Next &#8594;</button>
      <button onClick={onPlayToggle} disabled={!isComplete}>{isPlaying ? "Pause" : "Play ▶"}</button>
      <button onClick={onJumpToLatest} disabled={pinnedToLatest}>Jump to latest</button>
    </div>
  );
}

function Panes({ cycle, viewedStageIndex }) {
  const stages = cycle ? cycle.stages : {};
  const reached = (paneKey) => viewedStageIndex >= PANE_STAGE_INDEX[paneKey];
  const pending = <span className="pane-pending">not reached yet</span>;
  return (
    <div id="panes">
      <div className="pane">
        <h2>1. Input</h2>
        <pre>
          {reached("input") && stages.received
            ? renderSpannedText(stages.received.text || "", stages.received.spans)
            : pending}
        </pre>
      </div>
      <div className="pane">
        <h2>2. Outbound to API</h2>
        <pre>
          {reached("outbound") && (stages.forwarded || stages.tokenized)
            ? renderTokenizedText((stages.forwarded || stages.tokenized).text || "")
            : pending}
        </pre>
      </div>
      <div className="pane">
        <h2>3. API response</h2>
        <pre>
          {reached("response") && stages.response_received
            ? renderTokenizedText(stages.response_received.text || "")
            : pending}
        </pre>
      </div>
      <div className="pane">
        <h2>4. Developer view</h2>
        <pre>
          {reached("developer") && (stages.displayed || stages.detokenized)
            ? (stages.displayed || stages.detokenized).text || ""
            : pending}
        </pre>
      </div>
    </div>
  );
}

const MAX_AUDIT_ROWS = 50;

function AuditLogPane() {
  // Consumes /veil-panel/audit-stream directly (BRIEF SS5: "a panel that
  // consumes the audit log over SSE") -- structurally separate from the
  // pipeline-stream feeding the four panes above: every row here is exactly
  // what core/audit.py ever writes (token, type, detector, offset, adapter,
  // a value *hash*) and never the value itself, unlike the pipeline stream.
  const [entries, setEntries] = useState([]);

  useEventSource("/veil-panel/audit-stream", (entry) => {
    setEntries((prev) => [entry, ...prev].slice(0, MAX_AUDIT_ROWS));
  });

  return (
    <div className="pane">
      <h2>Audit log (live, no values -- {entries.length} of this session)</h2>
      <table>
        <thead>
          <tr><th>Time</th><th>Adapter</th><th>Type</th><th>Detector</th><th>Token</th></tr>
        </thead>
        <tbody>
          {entries.map((e, i) => (
            <tr key={`${e.token}-${e.timestamp}-${i}`}>
              <td>{new Date(e.timestamp).toLocaleTimeString()}</td>
              <td>{e.adapter}</td>
              <td>{e.entity_type}</td>
              <td>{e.detector}</td>
              <td>{e.token}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function VaultInspector() {
  const [mappings, setMappings] = useState([]);
  const [sessionId, setSessionId] = useState("");
  const [revealed, setRevealed] = useState({});

  const refresh = useCallback(() => {
    fetch("/veil-panel/vault")
      .then((r) => r.json())
      .then((data) => {
        setMappings(data.mappings || []);
        setSessionId(data.session_id || "");
      })
      .catch(() => {});
  }, []);

  useEffect(() => {
    refresh();
    const id = setInterval(refresh, 4000);
    return () => clearInterval(id);
  }, [refresh]);

  const reveal = (token) => {
    fetch("/veil-panel/vault/reveal", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, session_id: sessionId }),
    })
      .then((r) => r.json())
      .then((data) => setRevealed((prev) => ({ ...prev, [token]: data.value ?? data.error })));
  };

  return (
    <div className="pane">
      <h2>Vault inspector — session {sessionId || "(none yet)"}</h2>
      <table>
        <thead>
          <tr><th>Token</th><th>Type</th><th>Ciphertext</th><th>Created</th><th></th></tr>
        </thead>
        <tbody>
          {mappings.map((m) => (
            <tr key={m.token}>
              <td>{m.token}</td>
              <td>{m.entity_type}</td>
              <td title={m.ciphertext_b64}>{m.ciphertext_b64.slice(0, 12)}&hellip;</td>
              <td>{new Date(m.created_at * 1000).toLocaleTimeString()}</td>
              <td>
                {revealed[m.token] ? (
                  <code>{revealed[m.token]}</code>
                ) : (
                  <button onClick={() => reveal(m.token)}>Reveal</button>
                )}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function ModeReport({ mode, report }) {
  return (
    <div className="pane">
      <h2>{mode}</h2>
      {!report ? (
        <p>&hellip;</p>
      ) : !report.available ? (
        <p>unavailable: {report.reason}</p>
      ) : (
        <>
          <table>
            <thead>
              <tr><th>Entity</th><th>Support</th><th>Found</th><th>FP</th><th>Recall</th><th>Precision</th></tr>
            </thead>
            <tbody>
              {Object.entries(report.by_type).map(([name, m]) => (
                <tr key={name}>
                  <td>{name}</td>
                  <td>{m.support}</td>
                  <td>{m.true_positives}</td>
                  <td>{m.false_positives}</td>
                  <td>{m.recall.toFixed(3)}</td>
                  <td>{m.precision.toFixed(3)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          {Object.keys(report.by_detector).length > 0 && (
            <table>
              <thead><tr><th>Detector</th><th>Found</th><th>FP</th></tr></thead>
              <tbody>
                {Object.entries(report.by_detector).map(([name, m]) => (
                  <tr key={name}>
                    <td>{name}</td>
                    <td>{m.true_positives}</td>
                    <td>{m.false_positives}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </>
      )}
    </div>
  );
}

function MetricsTab() {
  // Regex/LLM/union comparison (mission-12). The llm/union modes are
  // genuinely expensive (one real LLM call per manifest entry), so this
  // never runs on its own -- it shows whatever was last persisted to
  // `.veil/metrics_comparison.json` (surviving a gateway restart) until
  // "Run comparison" is pressed explicitly.
  const [comparison, setComparison] = useState(null);
  const [running, setRunning] = useState(false);
  const [error, setError] = useState(null);

  const load = useCallback(() => {
    fetch("/veil-panel/metrics/comparison")
      .then((r) => r.json())
      .then(setComparison)
      .catch(() => {});
  }, []);

  useEffect(() => {
    load();
  }, [load]);

  const run = () => {
    setRunning(true);
    setError(null);
    fetch("/veil-panel/metrics/comparison", { method: "POST" })
      .then((r) => r.json())
      .then((data) => {
        setComparison(data);
        setRunning(false);
      })
      .catch((err) => {
        setError(String(err));
        setRunning(false);
      });
  };

  const hasResult = comparison && comparison.available;

  return (
    <div id="metrics-tab">
      <div className="metrics-header">
        <button onClick={run} disabled={running}>{running ? "Running…" : "Run comparison"}</button>
        {hasResult && (
          <span className="sub">last run at {new Date(comparison.generated_at).toLocaleString()}</span>
        )}
        {!hasResult && !running && <span className="sub">no comparison has been run yet</span>}
        {running && <span className="sub">running regex + LLM + union against the manifest&hellip;</span>}
        {error && <span className="sub" style={{ color: "var(--danger)" }}>{error}</span>}
      </div>
      {hasResult && (
        <div className="mode-grid">
          <ModeReport mode="regex" report={comparison.modes.regex} />
          <ModeReport mode="llm" report={comparison.modes.llm} />
          <ModeReport mode="union" report={comparison.modes.union} />
        </div>
      )}
    </div>
  );
}

function LiveTab({ hidden }) {
  const [cycles, setCycles] = useState({});
  const [order, setOrder] = useState([]);
  const [selectedRequestId, setSelectedRequestId] = useState(null);
  const [pinnedToLatest, setPinnedToLatest] = useState(true);
  const [manualStageIndex, setManualStageIndex] = useState(null);
  const [isPlaying, setIsPlaying] = useState(false);
  const [showInternal, setShowInternal] = useState(false);

  const knownRequestIdsRef = useRef(new Set());
  const pinnedToLatestRef = useRef(true);
  useEffect(() => {
    pinnedToLatestRef.current = pinnedToLatest;
  }, [pinnedToLatest]);

  useEventSource("/veil-panel/pipeline-stream", (event) => {
    const { request_id, stage, text, spans, timestamp, kind } = event;
    const isNewCycle = !knownRequestIdsRef.current.has(request_id);
    knownRequestIdsRef.current.add(request_id);

    setCycles((prev) => {
      const existing = prev[request_id];
      const stages = { ...(existing ? existing.stages : {}), [stage]: { text, spans, timestamp } };
      return {
        ...prev,
        [request_id]: {
          requestId: request_id,
          stages,
          kind: kind || (existing ? existing.kind : undefined) || "conversation",
          firstSeenAt: existing ? existing.firstSeenAt : timestamp,
        },
      };
    });

    setOrder((prev) => {
      if (prev.includes(request_id)) return prev;
      const next = [...prev, request_id];
      if (next.length > HISTORY_LIMIT) {
        const dropped = next.slice(0, next.length - HISTORY_LIMIT);
        dropped.forEach((id) => knownRequestIdsRef.current.delete(id));
        return next.slice(next.length - HISTORY_LIMIT);
      }
      return next;
    });

    if (isNewCycle) {
      // Pinning to "latest" only ever follows a real conversational
      // cycle -- jumping the selection onto a hidden session-title/
      // internal-agent-loop cycle would leave the panes pointed at
      // something the selector doesn't even show.
      const isHiddenKind = !showInternal && HIDDEN_KINDS.has(kind || "conversation");
      if (pinnedToLatestRef.current && !isHiddenKind) {
        setSelectedRequestId(request_id);
      }
      setManualStageIndex(null);
      setIsPlaying(false);
    }
  });

  const visibleOrder = showInternal
    ? order
    : order.filter((id) => !HIDDEN_KINDS.has(cycles[id] ? cycles[id].kind : "conversation"));
  const hiddenCount = order.length - visibleOrder.length;

  const selectCycle = (requestId) => {
    setSelectedRequestId(requestId);
    setManualStageIndex(null);
    setIsPlaying(false);
    setPinnedToLatest(
      visibleOrder.length > 0 && requestId === visibleOrder[visibleOrder.length - 1]
    );
  };

  const selectedCycle = selectedRequestId ? cycles[selectedRequestId] : null;
  const stagesPresent = selectedCycle ? STAGES.filter((s) => selectedCycle.stages[s]) : [];
  const latestStageIndex = stagesPresent.length - 1;
  const isComplete = selectedCycle ? cycleIsComplete(selectedCycle) : false;
  const viewedStageIndex = manualStageIndex !== null ? Math.min(manualStageIndex, latestStageIndex) : latestStageIndex;
  const viewedStage = viewedStageIndex >= 0 ? STAGES[viewedStageIndex] : null;

  useEffect(() => {
    if (!isPlaying) return;
    const id = setInterval(() => {
      setManualStageIndex((prevIndex) => {
        const next = (prevIndex ?? 0) + 1;
        if (next >= STAGES.length) {
          setIsPlaying(false);
          return STAGES.length - 1;
        }
        return next;
      });
    }, PLAY_INTERVAL_MS);
    return () => clearInterval(id);
  }, [isPlaying]);

  const stepPrev = () => {
    setIsPlaying(false);
    setManualStageIndex(Math.max(0, viewedStageIndex - 1));
  };
  const stepNext = () => {
    setIsPlaying(false);
    setManualStageIndex(Math.min(latestStageIndex, viewedStageIndex + 1));
  };
  const togglePlay = () => {
    if (isPlaying) {
      setIsPlaying(false);
      return;
    }
    setManualStageIndex(0);
    setIsPlaying(true);
  };
  const jumpToLatest = () => {
    const latestVisibleId = visibleOrder[visibleOrder.length - 1];
    if (latestVisibleId) {
      setSelectedRequestId(latestVisibleId);
    }
    setManualStageIndex(null);
    setIsPlaying(false);
    setPinnedToLatest(true);
  };

  return (
    <div hidden={hidden}>
      <CycleSelector
        order={visibleOrder}
        cycles={cycles}
        selectedRequestId={selectedRequestId}
        onSelect={selectCycle}
        hiddenCount={hiddenCount}
        showInternal={showInternal}
        onToggleShowInternal={() => setShowInternal((prev) => !prev)}
      />
      <Pipeline viewedStage={viewedStage} stagesPresent={stagesPresent} />
      <StageControls
        viewedStageIndex={viewedStageIndex}
        latestStageIndex={latestStageIndex}
        isComplete={isComplete}
        isPlaying={isPlaying}
        onPrev={stepPrev}
        onNext={stepNext}
        onPlayToggle={togglePlay}
        onJumpToLatest={jumpToLatest}
        pinnedToLatest={pinnedToLatest}
      />
      <div id="stage-caption">{viewedStage ? STAGE_EXPLANATION[viewedStage] : "Select or run a request to begin."}</div>
      <Panes cycle={selectedCycle} viewedStageIndex={viewedStageIndex} />
      <div id="bottom">
        <AuditLogPane />
        <VaultInspector />
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("live");

  return (
    <div>
      <header>
        <h1>veil — observability panel</h1>
        <span className="sub">
          live session, local only -- the panes below show real request/response text for
          inspection; the audit log itself never records a value, only a hash
        </span>
        <div id="tabs">
          <button className={"tab-btn" + (tab === "live" ? " active" : "")} onClick={() => setTab("live")}>
            Live
          </button>
          <button className={"tab-btn" + (tab === "metrics" ? " active" : "")} onClick={() => setTab("metrics")}>
            Metrics
          </button>
        </div>
      </header>
      <div className="legend">
        <span><span className="swatch" style={{ background: "var(--regex)" }}></span> regex-detected span</span>
        <span><span className="swatch" style={{ background: "var(--llm)" }}></span> LLM-detected span</span>
      </div>
      <LiveTab hidden={tab !== "live"} />
      {tab === "metrics" && <MetricsTab />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
