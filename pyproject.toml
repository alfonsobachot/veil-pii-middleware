[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veil-pii-middleware"
version = "0.1.0"
description = "PII sanitization middleware for Claude Code, built around a tokenization / de-tokenization cycle."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["veil_pii_middleware"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["veil_pii_middleware", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # import sorting
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplify
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
