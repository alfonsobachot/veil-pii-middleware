[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veil-pii-middleware"
version = "0.1.0"
description = "PII sanitization middleware for Claude Code, built around a tokenization / de-tokenization cycle."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # AES-GCM for the vault's ciphertext-at-rest. Pinned to one major line:
  # this is the project's first runtime dependency and it holds the master
  # key's cipher primitive, so an unreviewed major bump is not acceptable.
  # 50.x is the latest major as of writing, chosen over an older line since
  # this dependency is being added fresh with no prior-version constraint.
  "cryptography~=50.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
  "mypy>=1.11",
  # `build` drives the build gate; `hatchling` is present so that gate can run
  # with --no-isolation, keeping it fast and offline.
  "build>=1.2",
  "hatchling>=1.25",
  # Corpus generation only, never on the data path. Pinned to one minor line:
  # the manifest is reproducible per Faker version as well as per seed, so a
  # wider range lets the ground truth drift and turns the recall gate flaky.
  "faker~=40.38",
]

[tool.hatch.build.targets.wheel]
packages = ["veil_pii_middleware"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["veil_pii_middleware", "tests"]
# Vendored harness tooling: upstream code, not ours to restyle.
extend-exclude = [".harness"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # import sorting
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplify
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["veil_pii_middleware", "tests"]
strict = true
# Detection and vault code moves spans, bytes and ciphertext around; an
# unchecked Any there hides exactly the class of bug that leaks PII.
warn_unreachable = true
disallow_any_generics = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
