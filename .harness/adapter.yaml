adapter:
  repo: installed-project
  description: Cactus Blueprint Harness V2
  contract-version: 2

field-map:
  execution-lane: Execution lane
  human-review-trigger: Human review trigger
  delegation-mechanism: Delegation mechanism
  verification-contract: Validation plan
  risk-class: Risk class

enum-map: {}

required-sections:
  - Tooling And Approach Assessment

surfaces:
  objective-template: .harness/mission.md
  task-contract: .harness/mission.md
  failure-log: .harness/memory/events.jsonl
  standing-context:
    - CLAUDE.md
    - AGENTS.md
    - .harness/docs/operating-model.md

enforcement:
  validators:
    - name: check-task-contract
      source: .harness/internal/check-task-contract.py
      run: gate

approval:
  protected-actions:
    - merge
    - deploy
    - destructive-git
    - external-writes
    - secrets
    - permissions
    - production-config
  triggers:
    before-code: human approves mission and validation when the lane requires it
    before-merge: human
    before-deploy: human
    before-external-write: human
    before-destructive-command: human
    before-policy-change: human

extensions:
  lifecycle: "mission -> validation -> approval -> implementation -> verify -> validators -> handoff -> memory -> human merge decision"
